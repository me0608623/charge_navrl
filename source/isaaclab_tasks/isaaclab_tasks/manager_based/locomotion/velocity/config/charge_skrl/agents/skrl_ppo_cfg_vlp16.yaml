# ==============================================================================
# SKRL PPO 配置 - VLP-16 v3: MultiDiscrete 動作空間 + 139D 觀測
# ==============================================================================
# v3 架構（突破 50% 成功率瓶頸）
#   - Policy (Actor): 139 維觀測 → VLP16DiscretePolicy → 38 logits (19+19)
#   - Critic: 139 維觀測（與 Policy 相同）→ VLP16Value → scalar
# 動作空間: MultiDiscrete([19, 19]) — 兩組獨立 Categorical
# 控制頻率: 5Hz (dt=0.2s, decimation=20, sim.dt=0.01)
# ==============================================================================

seed: 42

# ==============================================================================
# 模型配置 — 使用自定義 VLP16 模型
# ==============================================================================
models:
  separate: True

  policy:
    class: vlp16_models.VLP16DiscretePolicy
    unnormalized_log_prob: True

  value:
    class: vlp16_models.VLP16Value
    clip_actions: False

# ==============================================================================
# 經驗回放
# ==============================================================================
memory:
  class: RandomMemory
  memory_size: -1

# ==============================================================================
# PPO Agent 配置
# ==============================================================================
agent:
  class: PPO

  rollouts: 128

  # v12 (diag_v9b): 4→3 — v9 在 OE 階段 KL 飆到 0.77（目標<0.3）
  # v9 用 epochs=4 + LR=1e-4 到 OE L7 但 KL 偏高；降 1 epoch 壓 KL ~25%
  learning_epochs: 3

  mini_batches: 16      # 8→16: 更小 batch → 更多梯度步

  # Phase 1 初始值（課程動態調整 0.990→0.998）
  # Phase 1: 0.990（100步視野），Phase 4b: 0.998（500步視野）
  discount_factor: 0.990

  # v10 (diag_v8): 回到 0.95 — diag_v7 驗證 λ=0.80 反而加劇 advantage 壓平
  # λ=0.80 adv_raw_std=0.012 vs λ=0.95(v6) adv_raw_std=0.15（低 12 倍）
  # 原因：短 GAE 視野讓 Critic 更容易學準短期 return → advantage 更快歸零
  lambda: 0.95

  # v6: KLAdaptiveLR → LinearLR — KL adaptive 在 786K batch 下完全失效
  # v4 (max=3e-4) 和 v5 (max=1.5e-4) 都全程鎖死 max，KL 始終落在不動區
  # 改用線性衰減：1e-4 → 3e-5
  # 注意：SKRL 每個 PPO update 呼叫 step() × learning_epochs 次
  # total_iters = (timesteps / rollouts) × learning_epochs = 1831 × 6 = 10986
  # v11 (diag_v9): 回到 1e-4 — diag_v8 驗證 floor 可控制 KL，LR=5e-5 太慢
  learning_rate: !!float 1e-4

  # v15: 恢復 LinearLR decay（v14 constant LR 更差）
  learning_rate_scheduler: "__import__('torch').optim.lr_scheduler.LinearLR"
  learning_rate_scheduler_kwargs:
    start_factor: 1.0
    end_factor: 0.3
    total_iters: 5493

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null

  # Fix 4: 啟用 Value preprocessor 穩定 value estimation
  # 防止 reward scale 變化導致 Critic 估值不穩定
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0

  ratio_clip: 0.2

  value_clip: 0.2
  # True→False: value clipping 在大 reward scale (+250 goal) 下會殺死 critic 梯度
  # 原因：predicted_values - sampled_values 超出 ±0.2 時 torch.clip 梯度為零
  # 導致 critic_grad_norm=0，value function 完全停止學習
  clip_predicted_values: False

  # MultiDiscrete([19,19])：H_max = ln(19)+ln(19) ≈ 5.89
  # v8: 恢復 0.01 — v7 的 0.03 過高，entropy 93% max 壓制 policy gradient
  # actor_grad 從 v6 的 0.10 降到 v7 的 0.08，策略被迫太均勻
  entropy_loss_scale: 0.01

  # v5: 0.5→1.0 恢復 — max_lr 砍半 + clip_predicted_values=False 已修，critic gradient 正常
  # critic 需要更強梯度信號來跟上 value function 變化
  value_loss_scale: 1.0

  kl_threshold: 0.0

  # v10: KL penalty in loss — prevent policy drift at high-difficulty stages
  # Schulman 2017 variant 1: loss += kl_coeff * E[(r-1) - log(r)]
  # v9b KL drifted 0.34→1.41 unchecked; this adds gradient-level constraint
  # v15: 0.3→0.1 — 研究顯示 robotics PPO 典型 KL coeff 0.0~0.05
  # 0.3 過度約束 policy，阻止適應高難度場景
  kl_coeff: 0.1

  rewards_shaper_scale: 1.0

  # v15: 恢復 True — bootstrap=False 讓 V(s) 系統性低估（Pardo 2018）
  # timeout 30% 的 return 被壓到 0 → Critic 低估密集場景 → 負向循環
  # 搭配 time_penalty -0.2 讓 timeout 不划算但 V(s) 不為零
  time_limit_bootstrap: True

  experiment:
    directory: "charge_vlp16"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: 11718  # 234375 × 5% ≈ 11718 → 20 個 checkpoint

# ==============================================================================
# 訓練器配置
# ==============================================================================
trainer:
  class: SequentialTrainer

  # 256 envs × 234375 timesteps = 60M env steps
  timesteps: 234375

  environment_info: log

# ==============================================================================
# 配置總結
# ==============================================================================
#
# | 參數 | 值 | 說明 |
# |------|-----------|------|
# | 控制頻率 | 5Hz (dt=0.2s) | 真實世界部署匹配 |
# | Actor 輸入 | 139 維 | ego(4) + goal(2) + LiDAR(72) + obs(60) + time(1) |
# | Critic 輸入 | 139 維 | 與 Policy 相同（v2 無特權資訊）|
# | 動作空間 | MultiDiscrete([19,19]) | 兩組獨立 Categorical（v3）|
# | Feature Extractor | VLP16FeatureExtractor | Conv1d(64D) + ObsMLP(32D) + StateMLP(32D) = 128D |
# | 學習率 | 1e-4 → 1e-5 | LinearLR 線性衰減 (v6: KL Adaptive 失效) |
# | 熵係數 | 0.01 | v8: 恢復，v7 的 0.03 壓制 policy gradient |
# | GAE lambda | 0.95 | v8: 恢復，v7 的 0.90 無改善 |
