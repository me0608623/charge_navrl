# ==============================================================================
# SKRL PPO 配置 - VLP-16 v3: MultiDiscrete 動作空間 + 139D 觀測
# ==============================================================================
# v3 架構（突破 50% 成功率瓶頸）
#   - Policy (Actor): 139 維觀測 → VLP16DiscretePolicy → 38 logits (19+19)
#   - Critic: 139 維觀測（與 Policy 相同）→ VLP16Value → scalar
# 動作空間: MultiDiscrete([19, 19]) — 兩組獨立 Categorical
# 控制頻率: 5Hz (dt=0.2s, decimation=20, sim.dt=0.01)
# ==============================================================================

seed: 42

# ==============================================================================
# 模型配置 — 使用自定義 VLP16 模型
# ==============================================================================
models:
  separate: True

  policy:
    class: vlp16_models.VLP16DiscretePolicy
    unnormalized_log_prob: True

  value:
    class: vlp16_models.VLP16Value
    clip_actions: False

# ==============================================================================
# 經驗回放
# ==============================================================================
memory:
  class: RandomMemory
  memory_size: -1

# ==============================================================================
# PPO Agent 配置
# ==============================================================================
agent:
  class: PPO

  rollouts: 128

  learning_epochs: 8

  mini_batches: 8

  # v3: 0.98→0.995 — 有效視野 50→200 步，匹配 episode 長度 225 步
  # 讓 Agent 看到繞路後的遠期目標獎勵，而非只看眼前的牆
  discount_factor: 0.995

  lambda: 0.95

  # v4: 保守 KL Adaptive — LR 限制在 5e-5 ~ 3e-4
  # v3 的 kl_threshold=0.016 + 預設 max_lr=1e-2 導致 LR 飆到 0.01（100× 初始值）
  # 修正：kl_threshold 回到 skrl 預設 0.008，max_lr 壓到 3e-4
  learning_rate: !!float 1e-4

  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    min_lr: !!float 5e-5
    max_lr: !!float 3e-4
    kl_factor: 2.0
    lr_factor: 1.5

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null

  # Fix 4: 啟用 Value preprocessor 穩定 value estimation
  # 防止 reward scale 變化導致 Critic 估值不穩定
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0

  ratio_clip: 0.2

  value_clip: 0.2
  # True→False: value clipping 在大 reward scale (+250 goal) 下會殺死 critic 梯度
  # 原因：predicted_values - sampled_values 超出 ±0.2 時 torch.clip 梯度為零
  # 導致 critic_grad_norm=0，value function 完全停止學習
  clip_predicted_values: False

  # MultiDiscrete([19,19])：H_max = ln(19)+ln(19) ≈ 5.89
  # 0.01 足夠驅動探索，避免 entropy 壓制 policy gradient
  entropy_loss_scale: 0.01

  # 1.0→0.5: 減緩 Critic 更新，避免 value gradient（峰值 1434）壓制 policy gradient
  value_loss_scale: 0.5

  kl_threshold: 0.0

  rewards_shaper_scale: 1.0

  time_limit_bootstrap: True

  experiment:
    directory: "charge_vlp16"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

# ==============================================================================
# 訓練器配置
# ==============================================================================
trainer:
  class: SequentialTrainer

  # 256 envs × 234375 timesteps = 60M env steps
  timesteps: 234375

  environment_info: log

# ==============================================================================
# 配置總結
# ==============================================================================
#
# | 參數 | 值 | 說明 |
# |------|-----------|------|
# | 控制頻率 | 5Hz (dt=0.2s) | 真實世界部署匹配 |
# | Actor 輸入 | 139 維 | ego(4) + goal(2) + LiDAR(72) + obs(60) + time(1) |
# | Critic 輸入 | 139 維 | 與 Policy 相同（v2 無特權資訊）|
# | 動作空間 | MultiDiscrete([19,19]) | 兩組獨立 Categorical（v3）|
# | Feature Extractor | VLP16FeatureExtractor | Conv1d(64D) + ObsMLP(32D) + StateMLP(32D) = 128D |
# | 學習率 | 1e-4 (5e-5~3e-4) | KL Adaptive 調度 (v4: 收緊範圍) |
# | 熵係數 | 0.01 | 離散空間需更高探索 |
