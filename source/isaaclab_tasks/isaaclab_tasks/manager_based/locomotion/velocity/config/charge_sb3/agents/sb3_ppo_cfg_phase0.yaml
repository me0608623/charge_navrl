# ==============================================================================
# Stable Baselines 3 PPO 配置 - Phase 0: 車輛動力學校準
# ==============================================================================
# Phase 0 特點：
#   - 空房間，無障礙物
#   - 學會開車：油門、方向盤控制
#   - 短距離目標（3-8 米）
#   - 需要大量探索來學習基本控制
# ==============================================================================

# ==================== 基礎配置 ====================
seed: 42
n_timesteps: !!float 1.66595e9
# Phase 0 總訓練步數：1,665,950,000 步（約 16.7 億步）
# 訓練統計：
#   - 總 Episode 數 ≈ 3,331,900（每 episode 500 步）
#   - 訓練時間估算：約 50-80 小時（RTX 3090, 256 envs）

policy: 'MlpPolicy'

# ==================== PPO 算法參數 ====================
n_steps: 128
# 🔥 修復：從 24 提高到 128
# 原問題：24 steps ÷ 50Hz = 0.48秒，軌跡太短
# 後果：GAE 無法準確估計優勢，Critic 難以學習價值函數
# 修復後：128 steps ÷ 50Hz = 2.56秒，足夠判斷導航趨勢
# 顯存影響：batch_size = n_steps × num_envs = 128 × 256 = 32,768（可控）

n_minibatches: 4
gae_lambda: 0.95
gamma: 0.99
n_epochs: 5
vf_coef: 1.0

# 🔥 Phase 0：高熵係數（最高探索）
ent_coef: 0.005
# 說明：
#   - Phase 0 是學習開車的階段，需要嘗試不同動作組合
#   - 0.005 提供最大探索，幫助發現有效的控制策略
#   - 避免過早收斂到次優策略（如總是轉圈、總是直走）
# 訓練後期：可以降低到 0.003 加速收斂

learning_rate: !!float 5e-5
# 🔥 降低學習率（從 1e-4 → 5e-5），防止梯度爆炸

clip_range: !!float 0.2
# Phase 0：標準 clipping

max_grad_norm: 0.5
# 🔥 更激進的梯度裁剪（從 1.0 → 0.5），防止梯度爆炸

# ==================== 策略網絡架構 ====================
policy_kwargs:
  activation_fn: 'nn.ELU'
  net_arch: [512, 256, 128]
  optimizer_kwargs:
    eps: !!float 1e-8
  ortho_init: True  # 🔥 啟用正交初始化（提升訓練穩定性）

# ==================== 觀測歸一化 ====================
normalize_input: True
normalize_value: False
clip_obs: 10.0

# ==================== Phase 0 訓練建議 ====================
# 預期指標：
#   - 成功率：> 95%
#   - 無震盪（動作平滑）
#   - 路徑效率 > 0.9
#
# 訓練時間：2-3 小時（RTX 3090, 256 envs）
#
# 關鍵監控：
#   - rollouts/ep_rew_mean：應該持續上升
#   - rollouts/ep_len_mean：應該逐漸下降（更快到達目標）
#   - train/entropy_loss：應該逐漸下降但仍保持正值
#
# 常見問題：
#   問題：機器人原地轉圈
#   解決：增加 ent_coef 到 0.008，或調整獎勵權重
#
#   問題：機器人速度太慢
#   解決：檢查 forward_velocity_reward 權重，確保足夠大
#
#   問題：動作抖動
#   解決：增加 action_smoothness 權重或 action_rate_penalty
