# ==============================================================================
# SKRL PPO 配置 - Phase 0: 車輛動力學校準
# ==============================================================================
# 從 Stable Baselines3 遷移到 SKRL
# 非對稱 Actor-Critic (AAC) 架構
#   - Policy (Actor): 81 維觀測 (無特權資訊)
#   - Critic: 131 維觀測 (上帝視角)
# 動作空間: Box(-1, 1, (2,)) - [前進速度, 旋轉速度]
# ==============================================================================

seed: 42

# ==============================================================================
# 模型配置 (Models) - Frame Stacking + AAC
# ==============================================================================
# SKRL 使用模型實例化工具來創建策略網路和價值網路
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
#
# 🆕 Frame Stacking 架構：
#   - 原始 Actor 觀測: 81 維
#   - 堆疊後 Actor 輸入: 81 × 3 = 243 維 (3 幀歷史)
#   - Critic 輸入: 243 + 50 = 293 維 (堆疊觀測 + 特權障礙物狀態)
#
models:
  separate: True  # Actor 和 Critic 使用分離的參數（AAC 架構）

  # 策略網路 (Actor/GaussianPolicy) - 243 維輸入 (81 × 3 幀堆疊)
  # 🆕 方案 A: 加深網絡以處理混合環境 (空/靜態/動態) + 時序歷史
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS  # Runtime 自動檢測為 243 維
        layers: [1024, 512, 256, 128]  # 🆕 加深網絡 (4層) 處理時序訊息
        activations: elu
    output: ACTIONS

  # 價值網路 (Critic/DeterministicValue) - 293 維輸入
  # 輸入 = 堆疊觀測 (243) + 特權障礙物狀態 (50)
  # 注意：雖然配置寫 OBSERVATIONS，但實際訓練時會使用 shared_states
  # 🆕 方案 A: 加深網絡以處理特權資訊 (障礙物速度) + 時序歷史
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS  # 會在 runtime 被 shared_states 替換 (293 維)
        layers: [1024, 512, 256, 128]  # 🆕 加深網絡 (4層)
        activations: elu
    output: ONE

# ==============================================================================
# 經驗回放記憶體 (Memory)
# ==============================================================================
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # 自動確定（等於 agent:rollouts）

# ==============================================================================
# PPO Agent 配置
# ==============================================================================
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO  # 使用標準 PPO (AAC 支援通過 shared_states 實現)

  # 與 SB3 對應的參數:
  # SB3: n_steps = 128
  rollouts: 128  # 每次更新前收集的步數

  # SB3: n_epochs = 5
  learning_epochs: 5  # 每次更新的訓練輪數

  # SB3: n_minibatches = 4
  mini_batches: 4  # 小批次數量

  # SB3: gamma = 0.99
  discount_factor: 0.99  # 折扣因子

  # SB3: gae_lambda = 0.95
  lambda: 0.95  # GAE lambda 參數

  # SB3: learning_rate = 5e-5
  # 🆕 方案 A: 提高學習率 (配合更多更新次數)
  learning_rate: !!float 2e-4  # 學習率 (提高 4x)

  # 學習率調度器（SKRL 原生支持 KL Adaptive LR）
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008  # KL 散度閾值（自適應調整學習率）

  # 狀態預處理器（歸一化）
  # SB3: normalize_input = True
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null

  # 價值預處理器（SB3: normalize_value = False）
  value_preprocessor: null
  value_preprocessor_kwargs: null

  # 隨機步數（預熱）
  random_timesteps: 0
  learning_starts: 0

  # SB3: max_grad_norm = 0.5
  grad_norm_clip: 0.5  # 梯度裁剪

  # SB3: clip_range = 0.2
  ratio_clip: 0.2  # PPO clipping 參數

  # 價值函數裁剪
  value_clip: 0.2  # 與 SB3 一致
  clip_predicted_values: True

  # SB3: ent_coef = 0.005
  entropy_loss_scale: 0.005  # 熵係數（探索）

  # SB3: vf_coef = 1.0
  value_loss_scale: 1.0  # 價值損失係數

  # KL 散度閾值（用於早停）
  kl_threshold: 0.0

  # 獎勵整形（可選）
  rewards_shaper_scale: 1.0

  # 時間限制啟動（是否對終止狀態 bootstrap）
  time_limit_bootstrap: False

  # 實驗配置
  experiment:
    directory: "charge_phase0"
    experiment_name: ""
    write_interval: auto  # 自動決定寫入間隔
    checkpoint_interval: auto  # 自動決定檢查點間隔

# ==============================================================================
# 訓練器配置 (Trainer)
# ==============================================================================
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer

  # 🔥 重要：SKRL timesteps 的真實含義
  # SequentialTrainer.train() 會執行 for timestep in range(timesteps):
  #   - 每個 timestep: env.step() 一次
  #   - 總環境步數 = timesteps × num_envs
  #
  # 但是！PPO agent 內部有 rollouts 參數，會累積 rollouts 步才更新一次：
  #   - 每累積 rollouts × num_envs 步後，更新一次 policy
  #   - 總 policy 更新次數 = timesteps / (rollouts / num_envs 實際上)
  #
  # 🆕 針對 1.67B 環境步數訓練
  #   - 總環境步數目標: 1,665,950,000 步
  #   - 512 envs: timesteps = 1,665,950,000 / 512 ≈ 3,253,809
  #   - 256 envs: timesteps = 1,665,950,000 / 256 ≈ 6,507,618
  #   - 每次更新收集: rollouts × num_envs = 128 × 512 = 65,536 步
  #   - 總更新次數: 1.67B / 65,536 ≈ 25,426 次 (512 envs)
  #   - 訓練時間估算: ~50-80 小時 (RTX 3090, 512 envs)
  #
  timesteps: 3253809  # 512 envs → 1,665,950,000 total env-steps (~1.67B)

  # 環境資訊記錄
  environment_info: log

# ==============================================================================
# 訓練建議
# ==============================================================================
# 預期指標：
#   - 成功率：> 95%
#   - 無震盪（動作平滑）
#   - 路徑效率 > 0.9
#
# 🆕 方案 A: RTX 5090 34GB VRAM 平衡配置
#   - num_envs: 512
#   - timesteps: 4000
#   - 總步數: 262M env-steps
#   - 訓練時間: ~1.5-2 小時 (5090 非常快!)
#   - VRAM 使用: ~25-30GB
#
# 關鍵監控指標：
#   - Reward/mean (平均獎勵)：應該持續上升
#   - Success/mean (成功率)：目標 > 95%
#   - Policy/entropy_loss：應該逐漸下降但仍保持正值
#   - Value/mean (價值估計)：穩定上升
#
# ═══════════════════════════════════════════════════════════════════════════
# 方案 A 配置總結 (針對 RTX 5090 34GB)
# ═══════════════════════════════════════════════════════════════════════════
#
# | 參數 | 方案 A 值 | 說明 |
# |------|-----------|------|
# | 總環境步數 | 262M | 超過 NavRL 2x |
# | 並行環境 | 512 | 充分利用 34GB VRAM |
# | Rollouts | 128 | 保持 |
# | Policy 更新 | 4000 | 足夠收斂 |
# | 學習率 | 2e-4 | 提高 4x |
# | 網絡層 | [1024,512,256,128] | 加深處理混合環境 |
# | 訓練時間 | 1.5-2 小時 | 5090 加速 |
#
# ═══════════════════════════════════════════════════════════════════════════
# 超參數對照 SB3
# ═══════════════════════════════════════════════════════════════════════════
#   SB3                    SKRL (方案 A)
#   -------------------    -------------------
#   n_steps=128           → rollouts=128
#   n_epochs=5            → learning_epochs=5
#   n_minibatches=4       → mini_batches=4
#   gamma=0.99            → discount_factor=0.99
#   gae_lambda=0.95       → lambda=0.95
#   learning_rate=5e-5    → learning_rate=2e-4 ⬆️
#   max_grad_norm=0.5     → grad_norm_clip=0.5
#   clip_range=0.2        → ratio_clip=0.2
#   ent_coef=0.005        → entropy_loss_scale=0.005
#   vf_coef=1.0           → value_loss_scale=1.0
#   net_arch=[512,256,128]→ layers=[1024,512,256,128] ⬆️
#   normalize_input=True  → state_preprocessor=RunningStandardScaler
#   gamma=0.99            → discount_factor=0.99
#   gae_lambda=0.95       → lambda=0.95
#   learning_rate=5e-5    → learning_rate=5e-5
#   max_grad_norm=0.5     → grad_norm_clip=0.5
#   clip_range=0.2        → ratio_clip=0.2
#   ent_coef=0.005        → entropy_loss_scale=0.005
#   vf_coef=1.0           → value_loss_scale=1.0
#   net_arch=[512,256,128]→ layers=[512,256,128]
#   normalize_input=True  → state_preprocessor=RunningStandardScaler
