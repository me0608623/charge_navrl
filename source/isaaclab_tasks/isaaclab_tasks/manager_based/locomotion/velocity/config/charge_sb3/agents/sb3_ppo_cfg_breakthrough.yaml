# ==============================================================================
# Stable Baselines 3 PPO 配置 - 突破 30% → 90% 瓶頸版本
# ==============================================================================
# 🚀 用於突破成功率卡在 30% 的局部最優瓶頸
#
# 主要修改：
#   1. 學習率衰減：3e-4 → 1e-5（線性衰減，在 Python 代碼中實現）
#   2. 初始化標準差：log_std_init = -2.0（大幅降低動作隨機性）
#   3. 熵係數：降低到 0.001（減少無效探索）
#   4. 到達獎勵：30.0 → 60.0（在環境配置中）
# ==============================================================================

# ==================== 基礎配置 ====================
seed: 42

n_timesteps: !!float 5e7
# 總訓練步數：50,000,000 步

policy: 'MlpPolicy'

# ==================== PPO 算法參數 ====================
n_steps: 24
# 每次更新的步數（每個環境）

n_minibatches: 4

gae_lambda: 0.95

gamma: 0.99

n_epochs: 5

vf_coef: 1.0

# 🔥 熵係數：降低以減少無效探索
ent_coef: !!float 1e-3
# 說明：從 0.003 → 0.001
# 原因：Entropy 卡在 -2.83 不動，說明探索策略被鎖死
# 目標：降低熵係數，讓 Agent 專注於利用已學到的策略

# 🚀 學習率：使用更高的初始值（Action A 修改版）
# 注意：SB3 的學習率調度需要通過 Python 代碼實現，YAML 只支持固定值
# 這裡使用 3e-4（高於原來的 1e-4）來加速初期收斂
learning_rate: !!float 3e-4
#
# 說明：從 1e-4 → 3e-4
# 效果：
#   - 更大的更新步幅，加速初期探索
#   - 配合 log_std_init=-1.0 降低動作隨機性
#   - 配合 ent_coef=0.001 減少無效探索
#
# 如果需要學習率衰減，需要在 Python 代碼中使用 linear_schedule() 函數

clip_range: !!float 0.2

# ==================== 策略網絡架構 ====================
policy_kwargs:
  activation_fn: 'nn.ELU'

  net_arch: [512, 256, 128]

  # 🔥 大幅降低動作標準差初始化（Action C - 強化版）
  log_std_init: !!float -2.0
  # 說明：從 -1.0 進一步降到 -2.0
  # 效果：std = exp(-2.0) ≈ 0.135（非常精確的控制）
  # 原因：
  #   - 強迫 Agent 保持冷靜，不要亂動
  #   - 降低初始 std 可以讓動作輸出高度集中
  #   - 配合學習率衰減，逐步收斂到精確控制

  optimizer_kwargs:
    eps: !!float 1e-8

  ortho_init: False

# ==================== 梯度裁剪 ====================
max_grad_norm: 1.0

# ==================== 觀測歸一化 ====================
normalize_input: True
normalize_value: False
clip_obs: 10.0

# ==================== 訓練策略說明 ====================
# 🎯 突破 30% → 90% 瓶頸的三管齊下策略：
#
# 1. 線性學習率衰減（Action A - 完整版）：
#    - 初始：3e-4，最終：1e-5
#    - 預熱：10% 步數
#    - 在 Python 代碼中使用 linear_schedule_with_warmup() 函數
#
# 2. 增強到達獎勵（Action B - 強化版）：
#    - reaching_goal weight: 30.0 → 60.0（2x）
#    - 讓 Agent 明白：只有到達終點才是真正的贏家
#
# 3. 大幅降低動作隨機性（Action C - 強化版）：
#    - log_std_init: -2.0（std ≈ 0.135）
#    - 強迫 Agent 保持冷靜，不要亂動
#
# 預期效果：
#   - Success Rate: 30% → 90%+
#   - Entropy Loss: 快速下降（不再卡住）
#   - Episode Reward: 穩定上升
