# ==============================================================================
# Stable Baselines 3 PPO 配置 - Phase 3: 複雜地形與動態障礙物
# ==============================================================================
# Phase 3 特點：
#   - 16x16m 房間，複雜內牆結構
#   - 動態障礙物：5 個移動的圓柱體
#   - 障礙物在 episode 間隨機位置
#   - 需要同時處理靜態牆壁和動態障礙
#   - 最複雜的導航任務
# ==============================================================================

# ==================== 基礎配置 ====================
seed: 42
n_timesteps: !!float 2e7
# Phase 3 總訓練步數：20,000,000 步
# 複雜地形 + 動態障礙物，最複雜的任務
# 建議監控成功率，>75% 可提前停止

policy: 'MlpPolicy'

# ==================== PPO 算法參數 ====================
n_steps: 128
# 🔥 修復：從 24 提高到 128
# 原問題：24 steps ÷ 50Hz = 0.48秒，軌跡太短
# 後果：動態障礙需要預測，短軌跡無法學會避障
# 修復後：128 steps ÷ 50Hz = 2.56秒，足夠觀察障礙運動趨勢

n_minibatches: 4
gae_lambda: 0.95
gamma: 0.99
n_epochs: 10
vf_coef: 1.0

# 🔥 Phase 3：平衡熵係數（探索與利用平衡）
ent_coef: 0.0015
# 說明：
#   - Phase 3 需要對付動態障礙，仍需探索
#   - 0.0015 平衡探索與利用
#   - 避免過度探索導致無法應對動態環境
# 訓練後期：可以降低到 0.001 鎖定最終策略

learning_rate: !!float 3e-5
# Phase 3：低學習率
# 最複雜任務，需要最穩定的訓練

clip_range: !!float 0.1
# Phase 3：收緊 clipping
# 極度保守的更新，鎖住已學會的策略

max_grad_norm: 0.5
# Phase 3：收緊梯度裁剪
# 最激進的梯度控制，確保絕對穩定

# ==================== 策略網絡架構 ====================
policy_kwargs:
  activation_fn: 'nn.ELU'
  net_arch: [512, 256, 128]
  optimizer_kwargs:
    eps: !!float 1e-8
  ortho_init: False

# ==================== 觀測歸一化 ====================
normalize_input: True
normalize_value: True
# Phase 3：啟用價值歸一化
# 動態環境，價值函數變化最大
clip_obs: 10.0

# ==================== Phase 3 訓練建議 ====================
# 預期指標：
#   - 成功率：> 75%（動態環境更難）
#   - 能夠同時處理靜態牆壁和動態障礙
#   - 能夠在障礙物擋路時等待或繞行
#
# 訓練時間：6-8 小時（RTX 3090, 256 envs）
#
# 關鍵監控：
#   - success_rate：應該持續上升（但會波動）
#   - Episode_Termination/collision：應該逐漸下降
#   - Episode_Termination/time_out：動態環境可能超時
#   - Episode_Reward/dynamic_obstacles_avoided：動態避障指標
#
# 常見問題：
#   問題：成功率波動大，無法收斂
#   解決：
#     1. 降低 learning_rate 到 1e-5
#     2. 增加 n_epochs 到 12
#     3. 檢查動態障礙物速度是否過快
#
#   問題：機器人總是被動態障礙物撞到
#   解決：
#     1. 增加 lidar 掃描範圍或解析度
#     2. 增加 dynamic_corridor_reward 權重
#     3. 降低障礙物移動速度
#
#   問題：策略在靜態牆壁表現好，但遇到動態障礙就崩潰
#   解決：
#     1. 使用課程學習：先靜態障礙，再慢慢引入動態
#     2. 從 Phase 2 檢查點遷移
#     3. 增加 ent_coef 到 0.002

# ==================== 課程學習建議 ====================
# 建議訓練流程：
# 1. 先用 Phase 2 模型預訓練（靜態環境）
# 2. 再用 Phase 3 配置微調（加入動態障礙）
# 3. 動態障礙物速度從 0 開始，慢慢增加
# 4. 障礙物數量從 1 個開始，慢慢增加到 5 個
