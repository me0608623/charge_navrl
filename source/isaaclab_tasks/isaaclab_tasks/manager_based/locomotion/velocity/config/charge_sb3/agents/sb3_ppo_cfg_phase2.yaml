# ==============================================================================
# Stable Baselines 3 PPO 配置 - Phase 2: 走廊與窄通道導航
# ==============================================================================
# Phase 2 特點：
#   - 16x16m 房間
#   - 內部有走廊結構
#   - 多個窄門口（1.2-1.5m 寬）
#   - T 型路口和十字路口
#   - 需要精確控制和對準
# ==============================================================================

# ==================== 基礎配置 ====================
seed: 42
n_timesteps: !!float 1.5e7
# Phase 2 總訓練步數：15,000,000 步
# 走廊與窄通道導航，需要較多訓練來學會精確控制
# 建議監控成功率，>80% 可提前停止

policy: 'MlpPolicy'

# ==================== PPO 算法參數 ====================
n_steps: 128
# 🔥 修復：從 24 提高到 128
# 原問題：24 steps ÷ 50Hz = 0.48秒，軌跡太短
# 後果：窄門、T型路口需要精確對準，短軌跡無法學會
# 修復後：128 steps ÷ 50Hz = 2.56秒，足夠完成通道穿越

n_minibatches: 4
gae_lambda: 0.95
gamma: 0.99
n_epochs: 8
vf_coef: 1.0

# 🔥 Phase 2：中等熵係數（適度探索）
ent_coef: 0.002
# 說明：
#   - Phase 2 需要精確對準門口，但也要探索不同路徑
#   - 0.002 平衡精確性與探索
#   - 避免過度探索導致無法收斂到精確策略
# 訓練後期：可以降低到 0.001 鎖定策略

learning_rate: !!float 5e-5
# Phase 2：較低學習率
# 精確控制任務需要更穩定的訓練

clip_range: !!float 0.15
# Phase 2：收緊 clipping
# 更保守的更新，保護精確控制策略

max_grad_norm: 0.8
# Phase 2：收緊梯度裁剪
# 確保訓練穩定性

# ==================== 策略網絡架構 ====================
policy_kwargs:
  activation_fn: 'nn.ELU'
  net_arch: [512, 256, 128]
  optimizer_kwargs:
    eps: !!float 1e-8
  ortho_init: False

# ==================== 觀測歸一化 ====================
normalize_input: True
normalize_value: True
# Phase 2：啟用價值歸一化
# 複雜環境，價值函數變化大
clip_obs: 10.0

# ==================== Phase 2 訓練建議 ====================
# 預期指標：
#   - 成功率：> 80%
#   - 能夠通過 1.2m 寬的門口
#   - 能夠在走廊中保持方向
#   - 能夠在 T 型路口選擇正確方向
#
# 訓練時間：5-7 小時（RTX 3090, 256 envs）
#
# 關鍵監控：
#   - success_rate：應該持續上升
#   - Episode_Termination/collision：應該逐漸下降
#   - Episode_Reward/lidar_clearance_reward：反映避障能力
#
# 常見問題：
#   問題：無法通過窄門口（總是撞到門框）
#   解決：
#     1. 降低 learning_rate 到 3e-5
#     2. 收緊 clip_range 到 0.1
#     3. 增加 lidar 相關獎勵權重
#
#   問題：在 T 型路口總是選錯方向
#   解決：
#     1. 增加 ent_coef 到 0.003（更多探索）
#     2. 檢查 goal_direction 是否正確
#     3. 增加訓練步數
#
#   問題：策略崩潰（獎勷突然下降）
#   解決：
#     1. 收緊 clip_range 到 0.1
#     2. 收緊 max_grad_norm 到 0.5
#     3. 從 Phase 1 的檢查點恢復
