# wd_sa2_a2c_aux — WD fixed SA2 A2C + aux
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa2_a2c_aux --headless --run_name <run_name>
#
# 注意：batch_size 不是直接設定欄位，而是由程式自動計算：
#   batch_size = num_envs × rollout_length = 1024 × 300 = 307200
# update 數 = timesteps / rollout_length = 270000 / 300 = 900

name: wd_sa2_a2c_aux                                                  # config 唯一識別名；與檔名一致，方便 registry / WandB 搜尋
description: "Fixed SA2 (SA2_nav_static), A2C, WD sparse reward, WD 7D aux enabled"  # 實驗描述；寫入 WandB config

# --- Environment / curriculum（環境與課程設定） ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD             # WD 版 task；env reward 歸零，訓練 reward 由 trainer module 計算
curriculum_version: warp_drive_single_agent_v1                # 課程版本；使用 wd_single_agent_v1.py 的 SA1~SA8 設定
initial_stage: 2                                              # 固定訓練的 SA stage；此檔對應 SA2_nav_static
fixed_stage: true                                             # 鎖定 stage，不做自動升降階；固定 phase 實驗必須 true
scene_profile: warp_drive_single_agent_v1                     # 場景 profile metadata；通常與 curriculum_version 相同
obstacle_mode: rule_based                                     # 使用 rule-based obstacle；避免同時訓練 obstacle policy 混入變因

# --- Profiles（LEGO 模組選擇） ---
reward_profile: wd_sparse                                     # WD sparse reward：goal reward / collision penalty / action cost
algorithm: a2c                                                # 演算法；a2c=WD-style 單次 full-batch，ppo=PPO clipped surrogate
aux_profile: wd_7d_geometry                                   # aux 任務；wd_7d_geometry=開啟 7D 幾何預測，none=關閉 aux
encoder_profile: extractor_rnn                                # 79D obs → Conv1d+MLP extractor → RNN；接續 SA1 checkpoint
critic_profile: symmetric                                     # critic profile metadata；目前 actor/critic 使用相同 deployable obs

# --- Training budget（訓練預算） ---
num_envs: 1024                                                # 平行環境數；增加會提高每次 update 的資料量，不增加 update 次數
rollout_length: 300                                           # 每個 env 每次 rollout 收集步數；影響 GAE horizon 與 RNN 序列資料
timesteps: 420000                                             # 控制 update 數；updates = timesteps / rollout_length = 1400（含 500 iter continuation）
seed: 42                                                      # 隨機種子；固定後方便跨 stage / algorithm 比較

# --- RL optimizer / return（RL 核心超參數） ---
lr: 0.0005                                                    # policy/value head 學習率；↑ from 0.0002，加大 actor gradient 效果
rnn_lr: 0.0005                                                # aux/RNN 學習率；noaux 時設 0 讓 RNN 不更新
aux_lr: 0.0                                                   # legacy aux lr fallback；實際以 aux_lr_* 細部設定為主
aux_lr_predict_head: 0.0005                                   # aux predict head 學習率；aux 開啟時可讓輸出映射一起學
aux_lr_fc_middle: 0.0005                                     # RNN 後 fc_middle 學習率；aux 開啟時可降低固定隨機映射問題
aux_lr_fc_front: 0.0005                                          # RNN 前 fc_front 學習率；PPO/保守設定通常先凍結
aux_lr_extractor: 0.0                                         # extractor 學習率；通常凍結以避免輸入表徵漂移
vf_coeff: 0.5                                                 # value loss 權重；critic 太弱可提高，但太高會壓制 actor
gamma: 0.984                                                  # 折扣因子 γ；WD constant，越接近 1 越重視長期 reward
gae_lambda: 0.95                                              # GAE λ；控制 advantage 的 bias-variance tradeoff
normalize_return: true                                        # normalize critic target；穩定 sparse reward 的 value scale
value_init_bias: 0.0                                          # value head 初始 bias；normalize_return=true 時建議 0
max_grad_norm: 1.0                                            # 全域梯度裁剪；對齊 SA1 curriculum trainer.max_grad_norm=1.0
tbptt_len: 0                                                  # 主 RL loss 的 TBPTT；0=關閉，aux 序列另由 aux_seq_len 控制
lr_decay: 0.0                                                 # LR decay；0=關閉，避免 phase config 混入額外變因

# --- PPO specific（PPO 專屬；A2C 下大多不生效） ---
ppo_epochs: 1                                                 # 每包 rollout batch 重複訓練幾輪；PPO 資料利用率主要來自這裡
mini_batches: 1                                              # 每個 epoch 切幾個 mini-batch；mini_batch_size = batch_size / mini_batches
clip_eps: 0.2                                                 # PPO ratio clip 範圍；A2C 設定時主要作為記錄/兼容

# --- Entropy（探索熵係數） ---
ent_coeff: 0.0                                                # legacy 單一 entropy 係數；0=不覆蓋 per-head 設定
ent_coeff_linear: 0.0                                         # linear head entropy；0 表示由 curriculum runtime 同步 phase 值
ent_coeff_angular: 0.0                                        # angular head entropy；0 表示由 curriculum runtime 同步 phase 值

# --- WD-style gradient caps / loss guards（WD 分離裁剪與 loss 保護） ---
wd_update_clip: true                                          # 啟用 actor/critic 分離 grad cap；避免 critic spike 壓制 actor
wd_update_monitor_only: false                                 # false=真的套用 cap；true=只記錄不裁剪
wd_actor_update_clip: 8.0                                     # actor grad norm cap；PPO 使用較保守 4，A2C 使用 WD-style 8
wd_critic_update_clip: 30.0                                   # critic grad norm cap；WD 常用 30
wd_module_entropy_eps: 0.000000000001                         # module_entropy 計算 epsilon；只防 log(0)
policy_loss_clamp: 20.0                                       # policy loss 量級保護；|policy_loss| 太大時縮放
vf_term_clamp: 8.0                                            # value term 量級保護；限制 vf_coeff × vf_loss spike

# --- Model / encoder（模型架構） ---
charge_encoder_mode: extractor_rnn                            # 79D → Conv1d+MLP(96D) → RNN；接續 SA1 checkpoint
hidden_dim: 30                                                # RNN hidden state 維度；WD memory_dim=30
preprocess_dim: 12                                            # 送給 RL head 的 RNN preprocess feature 維度；WD=12
fc_dim: 48                                                    # RNN 前 FC 寬度；extractor_rnn=48（96D → 48D）
wd_middle_dim: 0                                              # extractor_rnn 不使用雙層 fc_middle
rnn_type: RNN                                                 # RNN cell 類型；RNN 對齊 WD，GRU 會改 checkpoint 相容性

# --- Obstacle / scene controls（障礙物與場景控制） ---
obs_lr: 0.0003                                                # learned obstacle policy LR；rule_based 模式下不生效，保留記錄用
obs_ent_coeff: 0.1                                            # obstacle policy entropy；rule_based 模式下不生效
obs_speed_limit: 0.8                                          # obstacle speed fallback；實際 phase 可由 curriculum obstacle_speed_rate 同步
train_goal_rate: 3                                            # WD alternating rate；rule_based 下 charge 通常每 iter 訓練
obs_reward_mode: zero                                         # obstacle reward；rule_based/no obstacle training 下影響很小
max_active_obstacles: 10                                      # 最多活躍障礙物數；需與觀測 TopK/scene 設定相容
obs_size_rand: 0.0                                            # 障礙物大小隨機化；0=由 curriculum 自動同步
obs_collision_base: 0.9                                       # 幾何碰撞基準距離；需與 LiDAR/reward gate 一致
scene_bound_rand: 0.0                                         # 場景邊界隨機化；0=由 curriculum/預設控制
scene_bound_base: 7.0                                         # 場景邊界 fallback 半徑；只有無 per-env bounds 時使用
room_size: null                                               # 房間大小覆寫；null=使用 env/curriculum 預設

# --- Aux / RNN training（輔助任務與序列訓練） ---
aux_seq_len: 15                                               # aux TBPTT 序列長度；WD 常用 15
aux_burn_in: 0                                                # aux burn-in 步數；0=不跳過序列前段 loss
aux_seq_batch_size: 256                                       # 每次 aux update 抽樣序列數；越大越穩但 VRAM 越高
aux_grad_clip: 0.5                                            # aux/RNN 專用 grad clip；抑制 RNN feature drift
zero_preprocess_feature_for_rl: false                         # true=RL head 看不到 12D RNN feature；只用於消融

# --- Sim-to-Real Domain Randomization（域隨機化 — SA2: 引入低強度 LiDAR 噪聲） ---
# SA2 策略：開始接觸感測器噪聲，但強度減半，讓 agent 漸進適應。
lidar_no_noise: false                                         # SA2: 開啟 LiDAR noise
# LiDAR L1: Per-Ray（50% 校準值，漸進引入）
lidar_displacement_std: 0.001                                 # σ=1mm（校準值 2mm 的 50%）
lidar_hole_rate: 0.10                                         # 10%（校準值 20% 的 50%）
lidar_distractor_rate: 0.001                                  # ghost 0.1%（校準值的 50%）
lidar_distance_bias: false                                    # SA2: 暫不引入距離偏差
lidar_per_ring_bias: false                                    # SA2: 暫不引入 per-ring bias
# LiDAR L2: Per-Bin
lidar_obs_noise_std: 0.003                                    # 低強度觀測噪聲
lidar_block_dropout_prob: 0.0                                 # SA2: 不做 block dropout
lidar_block_dropout_width: [3, 8]
# LiDAR L3: Per-Episode DR
lidar_displacement_std_dr: null                               # SA2: 不做 per-episode DR
lidar_hole_rate_dr: null
# Physics DR
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
# Disturbance DR
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
# Actuator DR
enable_actuator_dr: false
actuator_delay_range: [0, 2]
actuator_velocity_scale: [0.9, 1.1]
actuator_motor_lag: 0.3

# Observation latency DR
obs_delay_steps: [0, 0]                                       # SA2: 不加延遲
# Heading stability reward
heading_stability_weight: 0.0                                  # SA2: 不啟用

# --- Runtime / logging ---
no_domain_randomization: false
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume（續訓設定） ---
checkpoint: null                                              # checkpoint path；建議啟動時用 CLI --checkpoint 覆蓋
no_resume_optimizer: true                                     # 換 stage/algorithm 時不載入舊 optimizer state

# --- Metadata（WandB 標籤與備註） ---
tags: [wd, sa2, a2c, aux, extractor_rnn, no_obs60]               # WandB tags；方便依 stage / algorithm / aux 篩選
notes: "wd_sa2_a2c_aux: fixed SA2_nav_static. batch_size is derived as num_envs * rollout_length = 307200."  # 實驗備註；會寫入 WandB config metadata

# ===========================================================================
# SA2 規劃筆記（基於 SA1 momentum-fix run 觀察，2026-05-13）
# ===========================================================================
#
# 【問題】SA1 回合長度僅 ~14.5 步（2.9 秒），原因：num_goals=10 在場景中密度過高，
#         agent 幾乎不需導航就碰到下一個 goal。導致：
#         (a) aux valid_seq 從 200k 降到 ~19k（14.5 步 ≈ seq_len=15，幾乎切不出有效序列）
#         (b) RNN memory 沒有被充分利用（不需要長程記憶就能完成任務）
#         (c) 無法考驗 agent 的長程規劃能力
#
# 【計劃調整】
#   1. 減少 goal 數量 — 降低 num_goals，讓 agent 需要實際導航才能到達
#   2. 增加 goal 最遠距離 — 讓 goal 可以出現在場景更遠的位置，延長導航時間
#   3. Goal 隨機移動 — 增加追蹤難度，RNN 需記住 goal 移動方向來預測下一步
#      → 正好對齊 aux 的 FUTURE(bx,by) 預測目標
#
# 【目標】回合長度回到 30-60 步以上，確保：
#   - valid_seq ≥ 50k（aux 訓練品質）
#   - RNN 有足夠長的序列發揮記憶優勢
#   - SA2 的靜態障礙物需要 agent 規劃繞行路線
#
# 【SA1 momentum-fix 參考數據】（run 854bo6eb，iter 594/900）
#   - SR_norm: 0.993, CR: 0.7%, VE: 0.782
#   - aux loss: 0.28 (bug) → 0.133 (fix 後 ATL)，下降 52%
#   - rnn_param_delta: 0.005~0.007（持續活躍）
#   - 線性熵: 1.29（已深度收斂）
# ===========================================================================
