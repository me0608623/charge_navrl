# wd_sa6_rnn64_vel — SA6 dense + RNN capacity (hidden_dim 64) + velocity aux (13D)
#
# Step 2 + Step 3 combined experiment (Plan A: preprocess_dim stays 12)
#   Step 2: hidden_dim 30 → 64, fc_dim 48 → 64, wd_middle_dim 0 → 48
#   Step 3: predict_dim 7 → 13, aux_velocity_topk = 3 (nearest 3 obstacles body-frame velocity)
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa6_rnn64_vel --headless \
#     --run_name sa6_rnn64_vel_ne1024_s42
#
# 注意：hidden_dim 改變 → RNN weights 不相容，必須從頭訓練（不能從 SA5 checkpoint 續訓）。
# batch_size = 1024 × 300 = 307200
# update 數 = timesteps / rollout_length = 450000 / 300 = 1500

name: wd_sa6_rnn64_vel
description: "SA6 dense + RNN 64D capacity + velocity aux 13D (Step 2+3). Train from scratch."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v1
initial_stage: 1
fixed_stage: false
scene_profile: warp_drive_single_agent_v1
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: symmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 450000
seed: 42

# --- RL optimizer / return ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.991
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy ---
ent_coeff: 0.0
ent_coeff_linear: 0.0
ent_coeff_angular: 0.0

# --- WD-style gradient caps / loss guards ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (Step 2: capacity upgrade) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux extension ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- Domain Randomization (SA1 baseline — training from scratch) ---
lidar_no_noise: true
no_domain_randomization: false

# Observation latency DR (off for early training)
obs_delay_steps: [0, 0]
# Heading stability reward (off for early training)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa6, a2c, aux, extractor_rnn, rnn64, velocity_aux, step2_step3]
notes: "SA6 RNN capacity upgrade (hidden_dim=64, fc_dim=64, middle_dim=48) + velocity aux 13D (topk=3). Train from scratch (Stage 1). Plan A: preprocess_dim unchanged."
