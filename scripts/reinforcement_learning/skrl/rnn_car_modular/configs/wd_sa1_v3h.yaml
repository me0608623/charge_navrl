# wd_sa1_v3h — SA1 v3h (部署主線: v3f_vaux 配方 + 小比例 head_on curriculum)
#
# ★ 背景 (2026-07-01)：v3f_vaux 主線 SA4 卡 ~61% head_on 平台 (overnight 裁決:
#   reactive+gap 即使給足探索也破不了;RNN 學位置不學運動)。重訓乾淨部署主線:
#     - curriculum → v3h (SA3-5 head_on 0.20→0.05 小比例;SA6/7 head_on 待後續 fine-tune)
#     - 配方完全沿用 v3f_vaux: GRU + feat_norm + predict_dim 7 (position-only) + huber
#     - 已證不可行的 velocity-aux / hybrid / 多幀 一律不帶 (aux_velocity_topk 0)
#   主要目標 = 堪用的部署 policy (不是刷 head_on)。
#
# ⚠️ 架構相容性：rnn_type GRU + feat_norm → 與舊 vanilla RNN checkpoint 不相容。
#   SA1 必須【從頭訓】(checkpoint: null)。後續 SA2→SA7 各自 resume【v3h lineage】前一 stage。
#
# ⚠️ train/play 必須設 CHARGE_USE_ACT_HIST=0 (obs 79D，act_hist 移除)。
#
# 用法 (從頭訓):
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa1_v3h --headless \
#     --feat_norm --aux_epochs 8 \
#     --run_name sa1_v3h_ne1024_s42

name: wd_sa1_v3h
description: "SA1 v3h (部署主線): v3f_vaux 配方 (GRU + feat_norm + aux_epochs 8 + 可訓 readout + huber + pos_scale 0.33 + predict_dim 7 position-only) + curriculum v3h (小比例 head_on 0.05 從 SA3). obs 79D. Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3h   # v3h: v3e + 小比例 head_on(0.05) 從 SA3
initial_stage: 1
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005   # ★vaux: 可訓 readout
aux_lr_fc_middle: 0.0005      # ★vaux: 可訓 readout
aux_lr_fc_front: 0.0005       # ★vaux: 可訓 readout
aux_lr_extractor: 0.0005      # reluFix: 解凍 extractor
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- velocity-aux 修復配方 (★vaux 核心) ---
rnn_type: GRU                 # ★vaux: vanilla RNN 學不會 → GRU
feat_norm: true               # ★vaux: extractor 輸出 per-dim 正規化進 RNN (關鍵缺件)
aux_epochs: 8                 # ★vaux: 每 iter 8 次 aux 更新加速收斂
aux_loss_type: huber          # ★vaux: 大誤差大梯度，打 log 陷阱
aux_huber_delta: 1.0
aux_target_pos_scale: 0.33    # ★vaux: 位置 target 縮放配 huber，抗常數陷阱

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA1 stage；floor 由 curriculum v3h/v3e 強制 0.02) ---
ent_coeff: 0.0
ent_coeff_linear: 0.02
ent_coeff_angular: 0.04

# --- v3f: 無 act_hist → dropout 無意義 ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64 → GRU64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48

# --- aux predict dim (★vaux: position-only 7D，proven probe path) ---
predict_dim: 7
aux_velocity_topk: 0

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA1 v3h: clean bootstrap = 只留系統偏差，隨機雜訊全關) ---
# vlp16_noise_mode=bias → 只注入 VLP-16 實測 per-ring 系統偏差 (mean~+12.9mm)，
#   無隨機 σ、無丟點。policy 先在乾淨感測下學會信任 LiDAR / 避障，SA2 起改 full。
# (取代舊 lidar_no_noise + distance_bias DR 組合；per-ring 實測值即權威系統偏差，
#  data-first 忠實注入，無臆造 DR。source: vlp16_noise/ 2026-07-01)
vlp16_noise_mode: bias
lidar_no_noise: false
no_domain_randomization: false

# --- Sim-to-Real DR (SA1: physics + disturbance + light actuator) ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (關閉：原 [0,1] 是 sin 波兇手；馬達延遲 actuator_dr 保留)
obs_delay_steps: [0, 0]
# Heading stability (SA1: off)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (★架構變 → 從頭訓) ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa1, v3h, vaux, deploy_mainline, gru, feat_norm, huber, a2c, aux, asymmetric, gru64, rmin025, no_act_hist, obs79d, smoothness0, head_on_small, fromscratch]
notes: "SA1 v3h 部署主線: v3f_vaux 配方 (GRU + feat_norm + predict_dim 7 position-only + huber) + curriculum v3h (小比例 head_on 0.05 從 SA3). 架構變→從頭訓. obs 79D."
