# wd_sa1_v2 — SA1 v2: Bootstrap navigation + Asymmetric Critic + RNN64 + Vel Aux
#
# v2 架構：從頭訓練，整合所有改善。SA1 階段無 LiDAR 噪聲，先學基本導航。
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa1_v2 --headless \
#     --run_name sa1_v2_ne1024_s42

name: wd_sa1_v2
description: "SA1 v2: Bootstrap nav, clean LiDAR, asymmetric critic, RNN64, vel aux 13D. Train from scratch."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v1
initial_stage: 1
fixed_stage: true
scene_profile: warp_drive_single_agent_v1
obstacle_mode: rule_based

# --- Profiles (v2: asymmetric critic) ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA1: active exploration) ---
ent_coeff: 0.0
ent_coeff_linear: 0.01
ent_coeff_angular: 0.02

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (v2: RNN64 capacity upgrade) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA1: clean noise OFF, but bias + per_ring ON 從一開始適應硬體特性) ---
lidar_no_noise: true   # 不加 random noise（保留 clean bootstrap）
lidar_distance_bias: true               # 但啟用 bias（硬體屬性）
lidar_distance_bias_k_dr: [-0.005, 0.005]   # SA1: 5m 處最壞 ±37mm（小範圍 intro）
lidar_distance_bias_b_dr: [-0.012, 0.012]   # ±12mm offset
lidar_per_ring_bias: true               # 啟用 16 通道偏差
no_domain_randomization: false

# --- Sim-to-Real DR (SA1: physics + disturbance + light actuator) ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true                    # SA1+: 從零開始適應馬達特性
actuator_delay_range: [0, 1]               # 0–200ms delay（輕度）
actuator_velocity_scale: [0.97, 1.03]      # ±3% motor variation（輕度）
actuator_motor_lag: 0.5                     # rise time ~0.4s

# Observation latency DR (SA1: off)
obs_delay_steps: [0, 0]
# Heading stability (SA1: off)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa1, v2, a2c, aux, asymmetric, rnn64, velocity_aux]
notes: "SA1 v2: bootstrap nav, clean LiDAR, asymmetric critic, RNN64 (hidden=64, fc=64, middle=48), vel aux 13D. From scratch."
