# wd_sa2_v2 — SA2 v2: Static env + low-intensity LiDAR noise + Asymmetric Critic + RNN64
#
# v2 架構：從 SA1_v2 checkpoint 續訓。引入低強度 LiDAR 噪聲（50% 校準值）。
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa2_v2 --headless \
#     --checkpoint logs/rnn_car/<sa1_v2_run>/checkpoint_XXXXXX.pt \
#     --run_name sa2_v2_ne1024_s42

name: wd_sa2_v2
description: "SA2 v2: Static env, low LiDAR noise (50% cal), asymmetric critic, RNN64, vel aux 13D. From SA1_v2."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v1
initial_stage: 2    # SA2_nav_static
fixed_stage: true
scene_profile: warp_drive_single_agent_v1
obstacle_mode: rule_based

# --- Profiles (v2) ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 420000
seed: 42

# --- RL optimizer ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 1.0          # ④ 從 0.5 回 1.0（SA1_v2 0.5 過嚴格，導致策略過早鎖死）
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA2: zeroed, curriculum syncs) ---
ent_coeff: 0.0
ent_coeff_linear: 0.0
ent_coeff_angular: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (v2: RNN64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA2: 全噪聲 ON，SA3 的 50%) ---
lidar_no_noise: false                       # 全噪聲開
lidar_displacement_std_per_meter: 0.00020   # 距離正比位移（5m 處 ±1mm）
lidar_displacement_std_soft: 0.001          # 軟性位移（SA3 量級 50%）
lidar_displacement_std: 0.0                 # 固定位移（仍 0，per_meter 涵蓋）
lidar_hole_rate: 0.10                       # 漏點 10%
lidar_distractor_rate: 0.001                # 偽距 0.1%
lidar_distance_bias: true                   # 一致性：bias 全程 ON
lidar_distance_bias_k_dr: [-0.005, 0.005]   # SA2: 同 SA1 等級
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true                   # 16 通道偏差 全程 ON
lidar_obs_noise_std: 0.003                  # 觀測高斯
lidar_block_dropout_prob: 0.03              # 連續區塊遮蔽 3%（SA3 0.05 的 50% upper）
lidar_block_dropout_width: [3, 8]
lidar_displacement_std_per_meter_dr: [0.00015, 0.00030]  # per-env DR（SA5 [0.00020,0.00060] 的 50%）
lidar_displacement_std_soft_dr: [0.001, 0.010]           # soft displacement DR（SA5 [0.002,0.020] 的 50%）
lidar_displacement_std_dr: null             # 固定位移 DR 不啟（per_meter_dr 已涵蓋）
lidar_hole_rate_dr: [0.05, 0.15]            # hole rate DR（SA5 [0.15,0.30] 的 50%~中心）

# --- Sim-to-Real DR ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true                    # 一致性：actuator 全程 ON
actuator_delay_range: [0, 1]                # SA2: 同 SA1 等級
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (SA2: off)
obs_delay_steps: [0, 0]
# ① Heading stability (SA2: 啟用，懲罰 omega 符號翻轉)
# 注意：reward = reward + weight × sign_flip × |omega|，weight 必須為負才是「懲罰」
heading_stability_weight: 0.0    # 【Test J】−0.05 → 0.0 看 fps 變化

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: logs/rnn_car/sa1_v2_lidar2_ne1024_s42/checkpoint_210000.pt   # SA1_v2_lidar2 iter 700 ckpt (SR 98.6%, flatten+circular encoder)
no_resume_optimizer: true                                          # 新階段 optimizer momentum 清零

# --- Metadata ---
tags: [wd, sa2, v2, a2c, aux, asymmetric, rnn64, velocity_aux, heading_stab, omega2]
notes: "SA2 v2: TLNI 50% cal, asymmetric critic, RNN64, vel aux 13D. From SA1_v2 ckpt. ω_max=2.0, max_grad_norm=1.0, heading_stab=-0.05 (penalize sign flip). Run: sa2_a2c_aux_vlp16_ne1024_s42"
