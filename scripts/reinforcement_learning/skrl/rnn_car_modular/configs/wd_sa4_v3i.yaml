# wd_sa4_v3i — SA4 v3i (深記憶 aux1 配方): 空間規劃 + head_on 0.3-0.5 + 目標隨機移動 + per-material 實測雜訊
#
# ★ v3i 配方 = v3h 唯一變因 aux_epochs 8→1（on-policy 過期教材 / 8遍作業壓探索 已證：entropy 0.018→0.149）。
#   其餘承重牆保留：GRU + feat_norm + 可訓 readout + huber + aux_target_pos_scale 0.33 + predict_dim 7。
# ★ curriculum v3h（07-04 修正版）: head_on 0.05 speed 0.3-0.5；goal 保持隨機移動（只移除 toward_obstacle）。
# ★ LiDAR: vlp16_noise_mode=full_material（實測 σ/bias/dropout + human dropout(d)）。
#
# ⚠️ resume【v3i lineage】SA3 checkpoint（GRU+feat_norm）。SA3 於 resume 65k（累計 ~125k）
#   SR 0.74-0.75 高原精通切換（v3i SA3 高原 > v3h 天花板 0.73），resume checkpoint_60000（累計 120k）。
# ⚠️ train/play 必須設 CHARGE_USE_ACT_HIST=0 (obs 79D)。
# ⚠️ SA3→SA4: dynamic 4→5、空間規劃加重。SR 下滑屬正常，對照組 v3h SA4 62.5 / v3f 歷史 82-84。
#
# 用法:
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa4_v3i --headless \
#     --feat_norm --aux_epochs 1 \
#     --checkpoint logs/rnn_car/sa3_v3i_ne1024_s42/checkpoint_60000.pt \
#     --run_name sa4_v3i_ne1024_s42

name: wd_sa4_v3i
description: "SA4 v3i: 空間規劃 (dynamic 5) + full_material 實測雜訊 + v3h curriculum 07-04 修正 (goal 隨機移動/head_on 0.3-0.5), aux_epochs 1 深記憶配方。From SA3_v3i 精通切換 (累計~125k, SR 0.74-0.75 高原)。obs 79D。Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3i   # ★v3i curriculum(07-05): v3h + actor cap 8→4 (抗 aux1 崩盤,場景完全同 v3h)
initial_stage: 4
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 420000
seed: 42

# --- RL optimizer (SA3 stage) ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005   # ★vaux: 可訓 readout
aux_lr_fc_middle: 0.0005      # ★vaux: 可訓 readout
aux_lr_fc_front: 0.0005       # ★vaux: 可訓 readout
aux_lr_extractor: 0.0005      # reluFix: 解凍 extractor
vf_coeff: 0.5
gamma: 0.994                  # SA4: 長 horizon (同 v3f_vaux SA4)
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 1.0
tbptt_len: 0
lr_decay: 0.0

# --- velocity-aux 修復配方 (★vaux 核心) ---
rnn_type: GRU                 # ★vaux
feat_norm: true               # ★vaux: 關鍵缺件
aux_epochs: 1               # ★v3i: 8遍真兇已殺
aux_loss_type: huber          # ★vaux
aux_huber_delta: 1.0
aux_target_pos_scale: 0.33    # ★vaux

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA3 stage: 0.005/0.02) ---
ent_coeff: 0.0
ent_coeff_linear: 0.0075   # ★07-04 崩盤緩解: 0.005→0.0075 (48-52k VE斷崩,entropy 0.44 薄緩衝+連續 grad 5+ burst)
ent_coeff_angular: 0.03    # ★07-04 崩盤緩解: 0.02→0.03 (預案第一級 ent floor;CLI 非零值優先於 curriculum sync)

# --- v3f: 無 act_hist → dropout 無意義 ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 4.0   # ★07-05 第二次崩盤緩解: 8→4 (killer burst=norm 5-7;實際生效值來自 v3i curriculum sync)
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (GRU64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48

# --- aux predict dim (★vaux: position-only 7D) ---
predict_dim: 7
aux_velocity_topk: 0

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.85
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA3 v3h: VLP-16 per-material 實測雜訊，延續 SA2) ---
# vlp16_noise_mode=full_material: full (牆/靜態=white_wall σ 8.67mm + per-ring bias + 19.5% dropout)
#   + 對「打到動態障礙(人)的 ray」套實測 human dropout(d)=0.0135·d+0.196 + mixed_pixel、σ=0。
vlp16_noise_mode: full_material
lidar_no_noise: false

# --- Sim-to-Real DR (延遲 DR 保留) ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (關閉：sin 波兇手；馬達延遲保留)
obs_delay_steps: [0, 0]
# Heading stability (off)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (★v3h lineage SA2；提早切換 resume 210k) ---
checkpoint: logs/rnn_car/sa3_v3i_ne1024_s42/checkpoint_60000.pt  # SA3 v3i resume 軸 60k = 累計 120k
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa4, v3i, aux1, vaux, deploy_mainline, gru, feat_norm, huber, a2c, aux, asymmetric, gru64, rmin025, no_act_hist, obs79d, smoothness0, head_on_small, full_material, spatial_plan, goal_random_walk]
notes: "SA4 v3h 部署主線: 空間規劃 + curriculum 07-03 patch (goal_move 全移除=對齊真實場景; head_on speed 0.3-0.5=留物理反應窗). oracle 100k 裁決後決策. From SA3 提早切換 (累計~150k)."
