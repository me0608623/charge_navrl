# wd_sa1_v3f_vaux — SA1 v3f + velocity-aux 修復配方 (vaux lineage 起點)
#
# ★ 背景 (2026-06-26)：整夜調查確立 velocity-aux 修復配方。
#   RNN hidden 終於能編碼障礙位置 (probe rel err 從 ~100% 降到 53%)。
#   完整修法 = reshape bug 修復 (已在 train_rnn_car_wdclip.py 程式碼，無條件生效，不需 config)
#   + 以下 config 欄位：
#     - rnn_type: GRU            (vanilla RNN 學不會；GRU 證實學得好)
#     - feat_norm: true          (extractor 輸出 per-dim 正規化再進 RNN；★關鍵缺件)
#     - aux_epochs: 8            (每 iter 多次 aux 更新加速收斂；8 即可，20 太慢)
#     - 可訓 readout             (aux_lr_predict_head/fc_middle/fc_front = 0.0005)
#     - aux_target_pos_scale: 0.33  (位置 target 縮放配 huber，抗常數陷阱)
#     - aux_loss_type: huber     (大誤差大梯度，打 log 陷阱)
#     - predict_dim: 7           (position-only，proven probe path)
#
# ⚠️ 架構相容性：rnn_type GRU + feat_norm → 與舊 v3f (vanilla RNN，無 feat_norm) checkpoint
#   不相容。SA1 必須【從頭訓】(checkpoint: null)。
#   後續 SA2→SA5 各自 resume【新 vaux lineage】前一 stage checkpoint，不是舊 v3f 的。
#
# ⚠️ train/play 必須設 CHARGE_USE_ACT_HIST=0 (obs 79D，act_hist 移除)。
#
# 用法 (從頭訓):
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa1_v3f_vaux --headless \
#     --feat_norm --aux_epochs 8 \
#     --run_name sa1_v3f_vaux_ne1024_s42

name: wd_sa1_v3f_vaux
description: "SA1 v3f + velocity-aux 修復配方 (GRU + feat_norm + aux_epochs 8 + 可訓 readout + huber + pos_scale 0.33 + predict_dim 7). vaux lineage 起點，架構變→從頭訓. obs 79D. Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3e   # v3e: penalty_smoothness=0 + ent_ang floor=0.02
initial_stage: 1
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005   # ★vaux: 可訓 readout
aux_lr_fc_middle: 0.0005      # ★vaux: 可訓 readout
aux_lr_fc_front: 0.0005       # ★vaux: 可訓 readout
aux_lr_extractor: 0.0005      # reluFix: 解凍 extractor
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- velocity-aux 修復配方 (★vaux 核心) ---
rnn_type: GRU                 # ★vaux: vanilla RNN 學不會 → GRU
feat_norm: true               # ★vaux: extractor 輸出 per-dim 正規化進 RNN (關鍵缺件)
aux_epochs: 8                 # ★vaux: 每 iter 8 次 aux 更新加速收斂
aux_loss_type: huber          # ★vaux: 大誤差大梯度，打 log 陷阱
aux_huber_delta: 1.0
aux_target_pos_scale: 0.33    # ★vaux: 位置 target 縮放配 huber，抗常數陷阱

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA1 stage；floor 由 curriculum v3e 強制 0.02) ---
ent_coeff: 0.0
ent_coeff_linear: 0.02
ent_coeff_angular: 0.04

# --- v3f: 無 act_hist → dropout 無意義 ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64 → GRU64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48

# --- aux predict dim (★vaux: position-only 7D，proven probe path) ---
predict_dim: 7
aux_velocity_topk: 0

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA1: clean noise OFF, bias + per_ring ON) ---
lidar_no_noise: true
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
no_domain_randomization: false

# --- Sim-to-Real DR (SA1: physics + disturbance + light actuator) ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (關閉：原 [0,1] 是 sin 波兇手；馬達延遲 actuator_dr 保留)
obs_delay_steps: [0, 0]
# Heading stability (SA1: off)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (★vaux 架構變 → 從頭訓) ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa1, v3f, vaux, velocity_aux_fixed, gru, feat_norm, huber, a2c, aux, asymmetric, gru64, rmin025, no_act_hist, obs79d, smoothness0, fromscratch]
notes: "SA1 v3f_vaux: velocity-aux 修復配方 (GRU + feat_norm + aux_epochs 8 + 可訓 readout + huber + pos_scale 0.33 + predict_dim 7). vaux lineage 起點. 架構變 (GRU+feat_norm) 不相容舊 v3f ckpt → 從頭訓. obs 79D, curriculum v3e."
