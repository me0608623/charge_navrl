# wd_sa3_v3d — SA3 v3d: 牆壁穿越 + 更密集動態 — 三件套延續
#
# 起點 (2026-06-15):
#   ckpt = sa2_v3d_ne1024_s42_resume/checkpoint_60000.pt (SA2_v3d 完訓 iter 1400)
#   ★ 原 SA2 run 在 iter 1200 CUDA wedge stall，已 kill + 從 360000 resume 跑完剩 200 iter。
#   SA2 動態 deterministic p95_flip 6.0-10.2%（三點驗證乾淨，三件套成功）
#
# ★ SA3 是 v3c 真正爆 sin 波的階段：v3c SA3 把 ent_ang sync 到 0.01 → angular
#   分布過尖鎖死 limit cycle。v3d curriculum 對 SA3 設 ent_ang floor 0.02，
#   正是針對此修復。配合 action_error + dropout，預期 SA3 動態下仍乾淨。
#
# v3d 三件套（繼承）:
#   1. act_hist action_error 編碼（env: CHARGE_ACT_HIST_MODE=action_error，必須設！）
#   2. act_hist dropout 0.2（train-only mask）
#   3. curriculum v3d: penalty_smoothness 0.015 + entropy_angular floor 0.02
#
# SA3 改動（vs SA2_v3d）:
#   - initial_stage: 2 → 3 (SA3_walls_crossing，牆 1-2 + 動態 ramp)
#   - gamma 0.984 → 0.990（SA3 stage）
#   - ent 0.03/0.05 → 0.005/0.02（SA3 stage，ent_ang 被 v3d floor 0.02 撐住）
#   - LiDAR DR 加重（hole 0.15、distractor 0.002、block_dropout 0.04）
#   - penalty_hit -8 → -12（curriculum SA3）
#
# ⚠️ train/play 必須設 CHARGE_ACT_HIST_MODE=action_error
#
# 用法 (用 launcher 設好 env var):
#   PYTHONUNBUFFERED=1 CHARGE_ACT_HIST_MODE=action_error \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa3_v3d --headless \
#     --checkpoint logs/rnn_car/sa2_v3d_ne1024_s42_resume/checkpoint_60000.pt \
#     --run_name sa3_v3d_ne1024_s42

name: wd_sa3_v3d
description: "SA3 v3d: 牆壁穿越 + 密集動態. From SA2_v3d 完訓. v3d SA3 ent_ang floor 0.02 修 v3c 在此的 sin 波. Requires CHARGE_ACT_HIST_MODE=action_error."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3d
initial_stage: 3
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 420000
seed: 42

# --- RL optimizer (與 SA3 stage 一致) ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.990
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 1.0
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA3 stage: 0.005/0.02; ent_ang 由 v3d floor 0.02 撐住) ---
ent_coeff: 0.0
ent_coeff_linear: 0.005
ent_coeff_angular: 0.02

# --- v3d: act_hist dropout (train-only mask) ---
act_hist_dropout: 0.2

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64, 維持) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.85
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA3: 噪聲加重) ---
lidar_no_noise: false
lidar_displacement_std_per_meter: 0.00030
lidar_displacement_std_soft: 0.005
lidar_displacement_std: 0.0
lidar_hole_rate: 0.15
lidar_distractor_rate: 0.002
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
lidar_obs_noise_std: 0.005
lidar_block_dropout_prob: 0.04
lidar_block_dropout_width: [3, 8]
lidar_displacement_std_per_meter_dr: [0.00020, 0.00045]
lidar_displacement_std_soft_dr: [0.002, 0.015]
lidar_displacement_std_dr: null
lidar_hole_rate_dr: [0.08, 0.20]

# --- Sim-to-Real DR (與 SA2_v3d 一致) ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (繼承 v3d)
obs_delay_steps: [0, 0]  # 2026-06-20 obs_delay 誤植→關閉(原[0,1]害 policy 滿舵);馬達延遲 actuator_dr 保留
# Heading stability (SA3: off — 用 smoothness penalty 代替)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
# SA2_v3d 原 run 在 iter 1200 (ckpt 360000) CUDA wedge stall，從 resume run 跑完剩 200 iter。
# 故 SA2 完訓 ckpt = sa2_v3d_ne1024_s42_resume/checkpoint_60000.pt（非原 run 的 420000）。
checkpoint: logs/rnn_car/sa2_v3d_ne1024_s42_resume/checkpoint_60000.pt
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa3, v3d, a2c, aux, asymmetric, rnn64, velocity_aux, rmin025, antijitter, act_hist_action_error, act_hist_dropout, smoothness015, ent_ang_floor02, walls, dynamic]
notes: "SA3 v3d: 牆壁穿越 + 密集動態. From SA2_v3d 完訓. v3d SA3 ent_ang floor 0.02 修 v3c sin 波元兇. action_error + dropout 0.2 + curriculum v3d."
