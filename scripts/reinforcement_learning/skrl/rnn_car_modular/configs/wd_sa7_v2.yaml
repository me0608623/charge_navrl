# wd_sa7_v2 — SA7 v2: High pressure + max wind/push + obs latency 2 + block dropout 15%
#
# 最高難度階段。最強 DR 壓力測試 + asymmetric critic 應對動態場景。
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa7_v2 --headless \
#     --checkpoint logs/rnn_car/<sa6_v2_run>/checkpoint_XXXXXX.pt \
#     --run_name sa7_v2_ne1024_s42

name: wd_sa7_v2
description: "SA7 v2: High pressure, max DR, block dropout 15%, obs latency [0,2], asymmetric critic, RNN64, vel aux 13D."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v1
initial_stage: 7
fixed_stage: true
scene_profile: warp_drive_single_agent_v1
obstacle_mode: rule_based

# --- Profiles (v2) ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 600000
seed: 42

# --- RL optimizer ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.997
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: partial
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy ---
ent_coeff: 0.0
ent_coeff_linear: 0.0
ent_coeff_angular: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (v2: RNN64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA7: max block dropout 15%) ---
lidar_no_noise: false
lidar_displacement_std_per_meter: 0.00036
lidar_displacement_std_soft: 0.0
lidar_displacement_std: 0.0
lidar_hole_rate: 0.20
lidar_distractor_rate: 0.002
lidar_distance_bias: true
lidar_per_ring_bias: true
lidar_obs_noise_std: 0.005
lidar_block_dropout_prob: 0.15
lidar_block_dropout_width: [3, 8]
lidar_displacement_std_per_meter_dr: [0.00020, 0.00060]
lidar_displacement_std_soft_dr: [0.002, 0.020]
lidar_displacement_std_dr: null
lidar_hole_rate_dr: [0.15, 0.30]
# distance_bias DR: per-episode 採樣，最大範圍涵蓋實測 ±36mm 加 margin
lidar_distance_bias_k_dr: [-0.018, 0.018]   # SA7: 完整涵蓋實測 (k≈-0.015) + margin
lidar_distance_bias_b_dr: [-0.040, 0.040]   # 完整涵蓋實測 (b≈+0.030) + margin

# --- Sim-to-Real DR (SA7: maximum pressure) ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 5.0]
disturbance_push_force: [8.0, 25.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 2]            # 0~400ms action delay (matches obs delay)
actuator_velocity_scale: [0.9, 1.1]     # ±10% motor efficiency variation
actuator_motor_lag: 0.3                  # 1st-order lag α (≈0.7s rise time)

# Observation latency DR (SA7: up to 2-step / 400ms)
obs_delay_steps: [0, 2]
# Heading stability (SA7: strongest penalty)
heading_stability_weight: -0.1

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa7, v2, a2c, aux, asymmetric, rnn64, velocity_aux, high_pressure]
notes: "SA7 v2: high pressure (goals=2, dynamic=6), max wind 5N, push 8-25N, block dropout 15%, obs latency [0,2], heading -0.1, asymmetric critic, RNN64, vel aux 13D. From SA6_v2."
