# wd_sa2_ppo_aux — WD fixed SA2 PPO + aux
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa2_ppo_aux --headless --run_name <run_name>
#
# 注意：batch_size 不是直接設定欄位，而是由程式自動計算：
#   batch_size = num_envs × rollout_length = 1024 × 300 = 307200
# update 數 = timesteps / rollout_length = 180000 / 300 = 600

name: wd_sa2_ppo_aux                                                  # config 唯一識別名；與檔名一致，方便 registry / WandB 搜尋
description: "Fixed SA2 (SA2_nav_static), PPO, WD sparse reward, WD 7D aux enabled"  # 實驗描述；寫入 WandB config

# --- Environment / curriculum（環境與課程設定） ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD             # WD 版 task；env reward 歸零，訓練 reward 由 trainer module 計算
curriculum_version: warp_drive_single_agent_v1                # 課程版本；使用 wd_single_agent_v1.py 的 SA1~SA8 設定
initial_stage: 2                                              # 固定訓練的 SA stage；此檔對應 SA2_nav_static
fixed_stage: true                                             # 鎖定 stage，不做自動升降階；固定 phase 實驗必須 true
scene_profile: warp_drive_single_agent_v1                     # 場景 profile metadata；通常與 curriculum_version 相同
obstacle_mode: rule_based                                     # 使用 rule-based obstacle；避免同時訓練 obstacle policy 混入變因

# --- Profiles（LEGO 模組選擇） ---
reward_profile: wd_sparse                                     # WD sparse reward：goal reward / collision penalty / action cost
algorithm: ppo                                                # 演算法；a2c=WD-style 單次 full-batch，ppo=PPO clipped surrogate
aux_profile: wd_7d_geometry                                   # aux 任務；wd_7d_geometry=開啟 7D 幾何預測，none=關閉 aux
encoder_profile: wd_exact_rnn                                 # encoder metadata；WD-like 113D obs + FC64→RNN30→FC32→12D
critic_profile: symmetric                                     # critic profile metadata；目前 actor/critic 使用相同 deployable obs

# --- Training budget（訓練預算） ---
num_envs: 1024                                                # 平行環境數；增加會提高每次 update 的資料量，不增加 update 次數
rollout_length: 300                                           # 每個 env 每次 rollout 收集步數；影響 GAE horizon 與 RNN 序列資料
timesteps: 180000                                             # 控制 update 數；updates = timesteps / rollout_length = 600
seed: 42                                                      # 隨機種子；固定後方便跨 stage / algorithm 比較

# --- RL optimizer / return（RL 核心超參數） ---
lr: 0.0001                                                    # policy/value head 學習率；PPO 通常比 A2C 保守
rnn_lr: 0.0001                                                # aux/RNN 學習率；noaux 時設 0 讓 RNN 不更新
aux_lr: 0.0                                                   # legacy aux lr fallback；實際以 aux_lr_* 細部設定為主
aux_lr_predict_head: 0.0001                                   # aux predict head 學習率；aux 開啟時可讓輸出映射一起學
aux_lr_fc_middle: 0.0001                                     # RNN 後 fc_middle 學習率；aux 開啟時可降低固定隨機映射問題
aux_lr_fc_front: 0.0                                          # RNN 前 fc_front 學習率；PPO/保守設定通常先凍結
aux_lr_extractor: 0.0                                         # extractor 學習率；通常凍結以避免輸入表徵漂移
vf_coeff: 0.5                                                 # value loss 權重；critic 太弱可提高，但太高會壓制 actor
gamma: 0.984                                                  # 折扣因子 γ；WD constant，越接近 1 越重視長期 reward
gae_lambda: 0.95                                              # GAE λ；控制 advantage 的 bias-variance tradeoff
normalize_return: true                                        # normalize critic target；穩定 sparse reward 的 value scale
value_init_bias: 0.0                                          # value head 初始 bias；normalize_return=true 時建議 0
max_grad_norm: 0.5                                            # 全域梯度裁剪；目前採文獻常用 0.5 保守值
tbptt_len: 0                                                  # 主 RL loss 的 TBPTT；0=關閉，aux 序列另由 aux_seq_len 控制
lr_decay: 0.0                                                 # LR decay；0=關閉，避免 phase config 混入額外變因

# --- PPO specific（PPO 專屬；A2C 下大多不生效） ---
ppo_epochs: 4                                                 # 每包 rollout batch 重複訓練幾輪；PPO 資料利用率主要來自這裡
mini_batches: 32                                              # 每個 epoch 切幾個 mini-batch；mini_batch_size = batch_size / mini_batches
clip_eps: 0.1                                                 # PPO ratio clip 範圍；A2C 設定時主要作為記錄/兼容

# --- Entropy（探索熵係數） ---
ent_coeff: 0.0                                                # legacy 單一 entropy 係數；0=不覆蓋 per-head 設定
ent_coeff_linear: 0.02                                        # linear head entropy；0 表示由 curriculum runtime 同步 phase 值
ent_coeff_angular: 0.05                                       # angular head entropy；0 表示由 curriculum runtime 同步 phase 值

# --- WD-style gradient caps / loss guards（WD 分離裁剪與 loss 保護） ---
wd_update_clip: true                                          # 啟用 actor/critic 分離 grad cap；避免 critic spike 壓制 actor
wd_update_monitor_only: false                                 # false=真的套用 cap；true=只記錄不裁剪
wd_actor_update_clip: 4.0                                     # actor grad norm cap；PPO 使用較保守 4，A2C 使用 WD-style 8
wd_critic_update_clip: 30.0                                   # critic grad norm cap；WD 常用 30
wd_module_entropy_eps: 0.000000000001                         # module_entropy 計算 epsilon；只防 log(0)
policy_loss_clamp: 20.0                                       # policy loss 量級保護；|policy_loss| 太大時縮放
vf_term_clamp: 8.0                                            # value term 量級保護；限制 vf_coeff × vf_loss spike

# --- Model / encoder（模型架構） ---
charge_encoder_mode: wd_exact_rnn                             # 實際訓練 encoder；只控制架構，不覆蓋 algorithm
hidden_dim: 30                                                # RNN hidden state 維度；WD memory_dim=30
preprocess_dim: 12                                            # 送給 RL head 的 RNN preprocess feature 維度；WD=12
fc_dim: 64                                                    # RNN 前 FC 寬度；wd_exact_rnn 會強制 64
wd_middle_dim: 32                                             # wd_exact_rnn 專用 middle FC 維度；extractor_rnn 下基本不影響
rnn_type: RNN                                                 # RNN cell 類型；RNN 對齊 WD，GRU 會改 checkpoint 相容性

# --- Obstacle / scene controls（障礙物與場景控制） ---
obs_lr: 0.0003                                                # learned obstacle policy LR；rule_based 模式下不生效，保留記錄用
obs_ent_coeff: 0.1                                            # obstacle policy entropy；rule_based 模式下不生效
obs_speed_limit: 0.8                                          # obstacle speed fallback；實際 phase 可由 curriculum obstacle_speed_rate 同步
train_goal_rate: 3                                            # WD alternating rate；rule_based 下 charge 通常每 iter 訓練
obs_reward_mode: zero                                         # obstacle reward；rule_based/no obstacle training 下影響很小
max_active_obstacles: 10                                      # 最多活躍障礙物數；需與觀測 TopK/scene 設定相容
obs_size_rand: 0.0                                            # 障礙物大小隨機化；0=由 curriculum 自動同步
obs_collision_base: 0.9                                       # 幾何碰撞基準距離；需與 LiDAR/reward gate 一致
scene_bound_rand: 0.0                                         # 場景邊界隨機化；0=由 curriculum/預設控制
scene_bound_base: 7.0                                         # 場景邊界 fallback 半徑；只有無 per-env bounds 時使用
room_size: null                                               # 房間大小覆寫；null=使用 env/curriculum 預設

# --- Aux / RNN training（輔助任務與序列訓練） ---
aux_seq_len: 15                                               # aux TBPTT 序列長度；WD 常用 15
aux_burn_in: 0                                                # aux burn-in 步數；0=不跳過序列前段 loss
aux_seq_batch_size: 256                                       # 每次 aux update 抽樣序列數；越大越穩但 VRAM 越高
aux_grad_clip: 0.5                                            # aux/RNN 專用 grad clip；抑制 RNN feature drift
zero_preprocess_feature_for_rl: false                         # true=RL head 看不到 12D RNN feature；只用於消融

# --- Runtime / safety / logging（執行、安全與日誌） ---
lidar_no_noise: true                                          # 關閉 LiDAR noise/distractor；正式 run 必須開
no_domain_randomization: false                                # true=關閉 domain randomization；固定 phase 通常保留 false
reward_speed_v05: false                                       # legacy reward speed ablation；false=不啟用
reward_mode: current                                          # legacy reward mode；主要 reward dispatch 由 reward_profile 控制
action_table_sample_size: 0                                   # action table artifact 抽樣；長訓練建議 0
log_interval: 10                                              # console/WandB log 間隔，單位 iteration
save_interval: 100                                            # checkpoint 儲存間隔，單位 iteration

# --- Checkpoint / resume（續訓設定） ---
checkpoint: null                                              # checkpoint path；建議啟動時用 CLI --checkpoint 覆蓋
no_resume_optimizer: true                                     # 換 stage/algorithm 時不載入舊 optimizer state

# --- Metadata（WandB 標籤與備註） ---
tags: [wd, sa2, ppo, aux, wd_exact_rnn]                          # WandB tags；方便依 stage / algorithm / aux 篩選
notes: "wd_sa2_ppo_aux: fixed SA2_nav_static. batch_size is derived as num_envs * rollout_length = 307200."  # 實驗備註；會寫入 WandB config metadata
