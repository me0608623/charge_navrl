# wd_sa4_deploy_dense — SA4 deploy_dense: 推進課程密度(8靜2動, room8.0=16×16), resume SA3畢業ckpt
#
# ★ 07-14 決策:①穩銜接(SA3)畢業(det90.1%,LR2e-4定案)。高密度先導det證:稀疏場②稅null是密度不夠假象,
#   但畢業政策在高密度(15靜)撞45%=晚反應/早避不足是真問題,要靠"在密度下訓練"練出早避。
#   → 推進課程密度(SA4起加靜態),reaction-curve(v/ω vs障礙距離)+撞靜態當驗收(非只碰撞率)。
#
# ★ 與 wd_sa3_deploy_dense 差異:
#   - initial_stage → 4 (curriculum SA4: 靜8/動2 crossing, 比SA3的6靜1動密)
#   - room_size → 8.0 (16×16, SA3的8.5→8.0 漸縮)
#   - scene_bound_base → 6.0 (=room_size-2)
#   - checkpoint → SA3畢業(sa3_deploy_dense_lr2e4/checkpoint_30000, det90.1%)
#   - LR: curriculum SA4 override=2e-4(已加_TRAINER_LR_OVERRIDE,防value-led崩,同SA3治法)
#   - ent_coeff 0.04/0.08 保留(逐階resume防entropy死亡螺旋)
#   - 其餘全同 SA3 (obs79D/wd_sparse/a2c/RNN64/隨機obs_near_goal全域)
#
# ⚠️ 待辦(deferred):範圍化static/goals=[ramp−2,ramp](project_curriculum_randomize_goals_obstacles,SA4起)
#   尚未實作(behavior_scheduler per-env randint for static/goals);本config用SA4固定8靜先推進,範圍化另補。
# ⚠️ Requires CHARGE_USE_ACT_HIST=0.
#
# 用法:
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa4_deploy_dense --headless --feat_norm \
#     --run_name sa4_deploy_dense_lr2e4_ne1024_s42

name: wd_sa4_deploy_dense
description: "SA4 deploy_dense: 推進課程密度(16×16/8靜2動 crossing,resume SA3畢業ckpt det90.1%). 乾淨79D v3f血緣(LiDAR-only). curriculum deploy_dense room8.0, LR2e-4(防崩). 驗收: reaction-curve早避+撞靜態+det SR≥90. Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3e_deploy_dense
initial_stage: 4
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles (乾淨，同 v3f) ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0005
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.97          # ★fix#4:0.95→0.97 拉長 credit propagation(密集場提早規劃需長程 credit)
normalize_return: false   # ★關:改用 popart(修 critic/actor 尺度不一致 bug);popart 由 CLI --popart 傳(config 白名單無此鍵)
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1           # a2c full-batch(algorithm=a2c 忽略此值);fix#2(minibatch+KL-stop)延後(需切 a2c→PPO,大改動待隔離)
clip_eps: 0.2

# --- Entropy (逐階resume防死亡螺旋,沿用SA3的0.04/0.08) ---
ent_coeff: 0.0
ent_coeff_linear: 0.04
ent_coeff_angular: 0.08

# --- act_hist dropout (v3f: 無 act_hist) ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 24
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 6.0      # =room_size-2
room_size: 8.0             # ★SA4: 16×16 (SA3的8.5→8.0 漸縮)

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (clean noise OFF, bias + per_ring ON) ---
lidar_no_noise: true
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
no_domain_randomization: false

# --- Sim-to-Real DR ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (obs_delay 關閉，馬達延遲 actuator_dr 保留)
obs_delay_steps: [0, 0]
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (from SA3 畢業 det90.1%) ---
checkpoint: 'logs/rnn_car/sa3_deploy_dense_lr2e4_ne1024_s42/checkpoint_30000.pt'
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa4, deploy_dense, a2c, aux, asymmetric, rnn64, obs79d, lidar_only, dense_deploy, lr2e4, density_ramp]
notes: "SA4 deploy_dense: 推進課程密度(16×16/8靜2動,resume SA3畢業ckpt det90.1%). LR2e-4防value-led崩. 驗收 reaction-curve早避+撞靜態+det SR≥90."
