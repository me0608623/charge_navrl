# wd_sa2_v3h — SA2 v3h 部署主線 (動態場景 + VLP-16 實測雜訊 full)
#
# ★ 配方沿用 v3f_vaux: GRU + feat_norm + aux_epochs 8 + 可訓 readout
#   + huber + aux_target_pos_scale 0.33 + predict_dim 7 (position-only)。
# ★ LiDAR: vlp16_noise_mode=full → 真機實測 σ 8.67mm(固定) + per-ring bias + 19.5% dropout。
#
# ⚠️ 相容性：resume【v3h lineage】SA1 完訓 checkpoint (GRU+feat_norm，與舊 vanilla RNN ckpt 不相容)。
# ⚠️ train/play 必須設 CHARGE_USE_ACT_HIST=0 (obs 79D)。
#
# 用法 (SA1 提早切換：stage1 已精通 SR98.7%/pos_r2 0.82，於 ~110k 手動停，resume 最新 ckpt 90k):
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa2_v3h --headless \
#     --feat_norm --aux_epochs 8 \
#     --checkpoint logs/rnn_car/sa1_v3h_ne1024_s42/checkpoint_90000.pt \
#     --run_name sa2_v3h_ne1024_s42

name: wd_sa2_v3h
description: "SA2 v3h 部署主線: 動態場景 + v3f_vaux 配方. From SA1_v3h 完訓 (GRU+feat_norm+position aux). obs 79D, curriculum v3h (小比例 head_on). Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3h   # v3h: v3e + 小比例 head_on(0.05) 從 SA3
initial_stage: 2
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 420000
seed: 42

# --- RL optimizer (SA2 stage) ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005   # ★vaux: 可訓 readout
aux_lr_fc_middle: 0.0005      # ★vaux: 可訓 readout
aux_lr_fc_front: 0.0005       # ★vaux: 可訓 readout
aux_lr_extractor: 0.0005      # reluFix: 解凍 extractor
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 1.0
tbptt_len: 0
lr_decay: 0.0

# --- velocity-aux 修復配方 (★vaux 核心) ---
rnn_type: GRU                 # ★vaux
feat_norm: true               # ★vaux: 關鍵缺件
aux_epochs: 8                 # ★vaux
aux_loss_type: huber          # ★vaux
aux_huber_delta: 1.0
aux_target_pos_scale: 0.33    # ★vaux

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA2 stage: 0.03/0.05) ---
ent_coeff: 0.0
ent_coeff_linear: 0.03
ent_coeff_angular: 0.05

# --- v3f: 無 act_hist → dropout 無意義 ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (GRU64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48

# --- aux predict dim (★vaux: position-only 7D) ---
predict_dim: 7
aux_velocity_topk: 0

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA2 v3h: VLP-16 實測經驗雜訊 full，data-first 忠實注入) ---
# vlp16_noise_mode=full 覆蓋所有 lidar_* 細項，以實測固定值注入：
#   σ 8.67mm (固定，R²=0.078 不隨距離變) + per-ring 系統偏差 (mean~+12.9mm) + 19.5% 丟點 + 0.25% mixed-pixel。
# 刻意「不帶」：舊 6cm L2 blanket (obs_noise 0.003，會淹掉真實 σ ~7×)、block dropout、per-episode DR。
#   全部以實測為準 (source: vlp16_noise/isaac_lab_noise_params.py 2026-07-01)。
# 想改「以實測值為中心的 DR (部署更 robust)」→ 移除本行、改回細項 lidar_*_dr 範圍。
vlp16_noise_mode: full
lidar_no_noise: false

# --- Sim-to-Real DR (延遲 DR 保留) ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (關閉：sin 波兇手；馬達延遲保留)
obs_delay_steps: [0, 0]
# Heading stability (SA2: off)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (★v3h lineage SA1 完訓；實際 step 由 --checkpoint CLI 覆寫) ---
checkpoint: logs/rnn_car/sa1_v3h_ne1024_s42/checkpoint_90000.pt
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa2, v3h, vaux, deploy_mainline, gru, feat_norm, huber, a2c, aux, asymmetric, gru64, rmin025, no_act_hist, obs79d, smoothness0, head_on_small, dynamic]
notes: "SA2 v3h 部署主線: 動態場景 + v3f_vaux 配方. From SA1_v3h 完訓. obs 79D, curriculum v3h (小比例 head_on 0.05). LiDAR noise ON 50%, 延遲 DR 保留."
