name: e2e_sa4_fsppo_clean_antispin_a
description: "A-only ablation on fixed SA4: add sustained near-obstacle low-speed high-yaw anti-spin penalty to the accepted clean PPO contract."

# Hold the scene fixed so behavior changes are attributable to reward A.
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_e2e_final20_v1
initial_stage: 4
fixed_stage: true
scene_profile: warp_drive_e2e_final20_v1
obstacle_mode: rule_based
room_size: 8.0
max_active_obstacles: 20

# Identical information flow to the accepted SA4 policy.
reward_profile: clean_progress
algorithm: ppo
aux_profile: none
encoder_profile: e2e_frame_stack
critic_profile: symmetric
charge_encoder_mode: extractor_rnn
lidar_frame_stack: 4
end_to_end_frame_stack: true
feat_norm: false

# Short ablation budget; checkpoint_25600 is the primary deterministic readout.
num_envs: 1024
rollout_length: 128
timesteps: 30000
seed: 42

# Accepted standard PPO contract.
lr: 0.0002
rnn_lr: 0.0
aux_lr: 0.0
aux_lr_predict_head: 0.0
aux_lr_fc_middle: 0.0
aux_lr_fc_front: 0.0
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.99
gae_lambda: 0.95
normalize_return: false
adv_norm_mode: full
value_init_bias: 0.0
max_grad_norm: 0.5
ppo_epochs: 4
mini_batches: 8
clip_eps: 0.2
target_kl: 0.015
value_clip_eps: 0.2

ent_coeff: 0.0
ent_coeff_linear: 0.005
ent_coeff_angular: 0.005

wd_update_clip: false
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 1000000000.0
vf_term_clamp: 1000000000.0

# Legacy checkpoint-compatible modules; unused by the accepted e2e path.
hidden_dim: 30
preprocess_dim: 12
fc_dim: 48
wd_middle_dim: 32
rnn_type: RNN
predict_dim: 7
aux_velocity_topk: 0
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 64
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# Clean simulation contract; C, B, DR, and every legacy near-obstacle tax stay off.
lidar_no_noise: true
lidar_distance_bias: false
lidar_per_ring_bias: false
no_domain_randomization: true
enable_actuator_dr: false
obs_delay_steps: [0, 0]
heading_stability_weight: 0.0
penalty_speed_near_obs: -1.0

# A v2: penalize sustained same-sign yaw near an obstacle, including moving spins.
anti_spin_weight: 0.15
anti_spin_hazard_distance: 1.5
anti_spin_omega_threshold: 0.8
anti_spin_progress_threshold: 0.02
anti_spin_grace_steps: 5
anti_spin_ramp_steps: 5
anti_spin_yaw_grace_deg: 180.0
anti_spin_yaw_ramp_deg: 180.0
anti_spin_dt: 0.2

reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 50
checkpoint: logs/rnn_car/sa4_e2e_fs4_cleanppo_from_sa3c12800_acthist0_ne1024_s42/checkpoint_89600.pt
no_resume_optimizer: true

tags: [e2e, frame_stack4, ppo, clean_progress, sa4, ablation, anti_spin_a, final20]
notes: "A-only v2 causal ablation. Speed is not gated: penalty begins only after sustained near-hazard, low-progress, same-sign yaw exceeds 180 degrees, then reaches full strength at 360 degrees. Acceptance requires fewer D-suite 360-degree spins without increased stopping, wall contact, obstacle contact, or wrong first-turn rate. C and B remain disabled."
