# NavRL-Ground V8 A2C + aux config -- v21-style dense reward
#
# 把訓練 reward 從 WD sparse 換成 NavRL-Ground V8 dense reward。
# 其他設定維持 A2C-WD + WD 7D aux + wd_exact_rnn。
#
# Reward dispatch:
# - env reward_manager 權重歸零
# - 訓練 reward 由 rnn_car_modular/rewards/navrl_dense_v8.py 外部計算

name: navrl_ground_a2c_aux                         # config 唯一識別名
description: "NavRL-Ground v8 dense reward, A2C, WD 7D aux, SA2 fixed"  # 實驗描述

# --- Environment / curriculum（環境與課程設定） ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD  # WD 版任務（env reward 歸零，由 module 控制）
curriculum_version: warp_drive_single_agent_v1     # 課程定義檔
initial_stage: 2                                   # 固定 SA2，讓 dense vs sparse 只改 reward
fixed_stage: true                                  # 不升降階
obstacle_mode: rule_based                          # 規則控制障礙物

# --- Profiles（模組選擇） ---
reward_profile: navrl_dense_v8                     # NavRL dense reward：每步提供 progress/safety/heading 訊號
algorithm: a2c                                     # A2C 演算法，避免同時改 reward 和 algorithm
aux_profile: wd_7d_geometry                        # 保留 WD 7D aux，只比較 reward 變因
encoder_profile: wd_exact_rnn                      # WD 原版 RNN 編碼器

# --- Training budget（訓練預算） ---
num_envs: 1024                                     # 並行環境數
rollout_length: 300                                # 每次 rollout 步數
timesteps: 180000                                  # 總 timesteps = 600 updates
seed: 42                                           # 隨機種子

# --- RL hyperparameters（RL 超參數） ---
lr: 2e-4                                           # policy/value head 學習率
rnn_lr: 5e-4                                       # RNN 學習率
vf_coeff: 0.5                                      # value loss 權重
gamma: 0.99                                        # dense reward 用略低 γ，避免過長視野放大 return
gae_lambda: 0.95                                   # GAE λ
max_grad_norm: 0.5                                 # 全域梯度裁剪（文獻共識 0.5）
normalize_return: true                             # 歸一化 critic target
value_init_bias: 0.0                               # value head bias 初始值

# --- Entropy（探索熵係數） ---
ent_coeff_linear: 0.05                             # 線速度 entropy 係數
ent_coeff_angular: 0.10                            # 角速度 entropy 係數

# --- WD-style gradient caps（WD 分離梯度裁剪） ---
wd_update_clip: true                               # 啟用分離 grad cap
wd_actor_update_clip: 8.0                          # actor grad norm 上限
wd_critic_update_clip: 30.0                        # critic grad norm 上限
vf_term_clamp: 8.0                                 # WD A2CK: vf_coeff×vf_loss 超過此值自動縮放

# --- Aux / RNN training（輔助任務訓練） ---
aux_seq_len: 15                                    # TBPTT 展開步數
aux_seq_batch_size: 256                            # aux mini-batch 序列數
aux_grad_clip: 0.5                                 # aux 梯度裁剪

# --- Sensors / logging（感測器與日誌） ---
lidar_no_noise: true                               # 關閉 LiDAR 雜訊
action_table_sample_size: 0                        # 動作診斷關閉
log_interval: 10                                   # log 間隔
save_interval: 100                                 # checkpoint 間隔
no_resume_optimizer: true                          # 不恢復 optimizer state

# --- Metadata（WandB 標籤） ---
tags: [navrl-ground-v8, sa2, a2c, aux, dense-reward]  # 含 dense-reward 標記
