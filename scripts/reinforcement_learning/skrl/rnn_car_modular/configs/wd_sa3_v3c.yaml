# wd_sa3_v3c — SA3 v3c: 牆壁 + crossing 行為 + goal 朝障礙物移動
#
# 起點 (2026-06-11):
#   ckpt = sa2_v3c_ne1024_s42/checkpoint_360000.pt (iter 1200)
#   SR 96.1% / CR 4.2% / p95_flip 46.6% / p95_ω_std 0.838 / ent_lin 1.76
#
# SA3 改動（vs SA2_v3c）:
#   - initial_stage: 2 → 3 (SA3_walls_crossing)
#   - 場景: + walls 1-2, + 1 static obs, + 1 dynamic obs, + horizontal_crossing
#   - goal: 朝障礙物移動 (toward_obstacle, 0.15 m/s)
#   - penalty_hit: -8 → -12
#   - entropy_lin: 0.03 → 0.005, entropy_ang: 0.05 → 0.01（curriculum 帶起）
#   - LiDAR DR 提升至 SA3 等級（hole 15%, distractor 0.002）
#
# 繼承 v3c 特性:
#   - action stacking (past 2 actions, 4D obs)
#   - obs_delay [0,1]
#   - smoothness 0.005
#   - r_min 0.25
#   - obs 83D / StateMLP 11D
#
# 用法:
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa3_v3c --headless \
#     --checkpoint logs/rnn_car/sa2_v3c_ne1024_s42/checkpoint_360000.pt \
#     --run_name sa3_v3c_ne1024_s42

name: wd_sa3_v3c
description: "SA3 v3c: 牆壁 + crossing + goal 動態. From SA2_v3c iter 1200 (SR 96.1%, p95_flip 46.6%)."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3
initial_stage: 3
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 420000
seed: 42

# --- RL optimizer (與 SA3 stage 一致) ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.990
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 1.0
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (SA3 stage: 0.005/0.01, 從 SA2 大幅降低) ---
ent_coeff: 0.0
ent_coeff_linear: 0.005
ent_coeff_angular: 0.01

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64, 維持 v3c) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.85
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA3: 全噪聲 ON, 80% 校準, 略提升 vs SA2 50%) ---
lidar_no_noise: false
lidar_displacement_std_per_meter: 0.00030
lidar_displacement_std_soft: 0.005
lidar_displacement_std: 0.0
lidar_hole_rate: 0.15
lidar_distractor_rate: 0.002
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
lidar_obs_noise_std: 0.005
lidar_block_dropout_prob: 0.04
lidar_block_dropout_width: [3, 8]
lidar_displacement_std_per_meter_dr: [0.00020, 0.00045]
lidar_displacement_std_soft_dr: [0.002, 0.015]
lidar_displacement_std_dr: null
lidar_hole_rate_dr: [0.08, 0.20]

# --- Sim-to-Real DR (與 SA2_v3c 一致) ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (繼承 v3c)
obs_delay_steps: [0, 0]  # 2026-06-20 obs_delay 誤植→關閉(原[0,1]害 policy 滿舵);馬達延遲 actuator_dr 保留
# Heading stability (SA3: off — 用 smoothness penalty 代替)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: logs/rnn_car/sa2_v3c_ne1024_s42/checkpoint_360000.pt
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa3, v3c, a2c, aux, asymmetric, rnn64, velocity_aux, rmin025, antijitter, action_stacking, walls, crossing]
notes: "SA3 v3c: 牆壁 + horizontal_crossing + goal 動態. From SA2_v3c iter 1200."
