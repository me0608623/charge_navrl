# wd_sa6_a2c_aux — Standard 20x20m SA6 dense: goals=3, penalty=-25, timeout=-12.5, near_miss 20%
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa6_a2c_aux --headless \
#     --checkpoint logs/rnn_car/sa5_tc_g1_p30_ne1024_s42/checkpoint_270000.pt \
#     --run_name sa6_dense_ne1024_s42
#
# 從 SA5 TC checkpoint 續訓，回到標準 20×20m 場景。SA6_dense_avoid (stage 6)。
# batch_size = 1024 × 300 = 307200
# update 數 = timesteps / rollout_length = 450000 / 300 = 1500

name: wd_sa6_a2c_aux
description: "Standard 20x20m SA6 dense: goals=3, penalty=-25, timeout=-12.5, near_miss 20%. From SA5 TC checkpoint."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v1
initial_stage: 6
fixed_stage: true
scene_profile: warp_drive_single_agent_v1
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: symmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 450000
seed: 42

# --- RL optimizer / return (SA5 TC baseline, SA6 trainer will sync) ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.996
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: partial
value_init_bias: 0.0
max_grad_norm: 1.0
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy ---
ent_coeff: 0.0
ent_coeff_linear: 0.0
ent_coeff_angular: 0.0

# --- WD-style gradient caps / loss guards ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (match SA5 TC extractor_rnn architecture) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 30
preprocess_dim: 12
fc_dim: 48
wd_middle_dim: 0
rnn_type: RNN

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- Sim-to-Real Domain Randomization（域隨機化 — SA6: 完整 TLNI + 強化擾動） ---
# SA6 策略：同 SA5 完整噪聲，風力稍增，為 dense dynamic 場景做準備。
lidar_no_noise: false
# LiDAR L1: Per-Ray
lidar_displacement_std: 0.002
lidar_hole_rate: 0.20
lidar_distractor_rate: 0.002
lidar_distance_bias: true
lidar_per_ring_bias: true
# LiDAR L2: Per-Bin
lidar_obs_noise_std: 0.005
lidar_block_dropout_prob: 0.10
lidar_block_dropout_width: [3, 8]
# LiDAR L3: Per-Episode DR
lidar_displacement_std_dr: [0.0005, 0.005]
lidar_hole_rate_dr: [0.15, 0.30]
# Physics DR
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
# Disturbance DR（稍增風力上限）
disturbance_wind_force: [0.0, 4.0]                            # SA6: 風力 → 4N
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
# Actuator DR
enable_actuator_dr: false
actuator_delay_range: [0, 2]
actuator_velocity_scale: [0.9, 1.1]
actuator_motor_lag: 0.3

# --- Runtime / logging ---
no_domain_randomization: false
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa6, a2c, aux, extractor_rnn, partial_norm, p25, timeout, near_miss]
notes: "Standard 20x20m SA6 dense: goals=3, penalty=-25, timeout=-12.5, near_miss 20%, dynamic=6. From SA5 TC checkpoint_270000."
