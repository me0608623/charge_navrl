# wd_sa4_deploy_dense_distr — SA4 密度「分布」版：靜態 per-env 抽 [6,8] 而非固定 8
#
# ★ 07-14 起因（用戶提議）：SA4 固定 8 靜密度硬跳，egwadwgi 訓練 SR 卡 0.615 連 6 檢不爬
#   （vl 續降=無崩、entL runaway=零 task 梯度平原）。用戶：「density 分布拉回一點再慢慢推上去」。
#   → 靜態改 per-env 分布 [ramp−2, ramp]=[6,8]：一個 batch 內混 6/7/8 靜態，
#     簡單 env 給梯度牽引力、難 env 拉伸能力，再把下界 6→7→8 慢慢推。
#
# ⚠️⚠️ 待發（等 ckpt30k det 裁決）：
#   - 若 det ≫ 0.615（如 ≥80%）→ 0.615 是訓練熵遮蔽的假象、無密度問題 → 本 config 不需發，直接畢業。
#   - 若 det ≈ 0.615 → 坐實密度硬跳爬不動 → 發此 config（density 分布 smooth 重訓）。
#
# ⚠️⚠️ 尚缺機制（需先實作+smoke test，勿在 det 前趕）：
#   scheduler 的靜態數 = behavior_mix["static"] × max_active_obstacles（比例制，非整數欄），
#   全 env 共用同一 behavior_mix。要「per-env 靜態抽 [6,8]」需兩處改動：
#     (1) curriculum wd_single_agent_v3e_deploy_dense.py：加 _STATIC_MIN={"SA4_spatial_plan":6}
#         + sc["static_obstacles_min"]=... （對稱現有 _DYNAMIC_MIN/dynamic_obstacles_min）。
#     (2) behavior_scheduler.py：reset 時 per-env 抽 static_count∈[min,max]，
#         據此 per-env 分配 static vs dynamic slot（現況單一 behavior_mix → 要 per-env 化）。
#   完成前本 config 的 curriculum_version 仍指 deploy_dense，靜態會 fallback 成固定 8（=等同現行 SA4）。
#   實作落地後把 static_obstacles_min 生效路徑接上即可。
#
# ★ 與 wd_sa4_deploy_dense（固定 8）唯一差異：靜態密度 8 → 分布 [6,8]（機制待實作）。
#   其餘全同：resume SA3 畢業 ckpt(det90.1%)、room8.0/16×16、lr2e-4、PopArt、gae_lambda0.97、
#   ent floor 0.04/0.08、79D v3f 血緣、a2c、RNN64。
# ⚠️ Requires CHARGE_USE_ACT_HIST=0.
#
# 用法（det 確認需要後才發）:
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa4_deploy_dense_distr --headless --feat_norm \
#     --popart --popart_beta 0.99 \
#     --run_name sa4_deploy_dense_distr_lr2e4_popartfix_ne1024_s42

name: wd_sa4_deploy_dense_distr
description: "SA4 密度分布版：靜態 per-env 抽[6,8]而非固定8(smooth 密度硬跳,治 SR 0.615 卡點). resume SA3畢業ckpt det90.1%. 其餘同 wd_sa4_deploy_dense. ⚠️靜態range機制待實作(scheduler per-env)+等det裁決才發. Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3e_deploy_dense
initial_stage: 4
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles (乾淨，同 v3f) ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0005
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.97
normalize_return: false   # popart 由 CLI --popart 傳
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (逐階resume防死亡螺旋,沿用SA3/SA4的0.04/0.08) ---
ent_coeff: 0.0
ent_coeff_linear: 0.04
ent_coeff_angular: 0.08

# --- act_hist dropout (v3f: 無 act_hist) ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 24
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 6.0      # =room_size-2
room_size: 8.0             # SA4: 16×16

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (clean noise OFF, bias + per_ring ON) ---
lidar_no_noise: true
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
no_domain_randomization: false

# --- Sim-to-Real DR ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (obs_delay 關閉，馬達延遲 actuator_dr 保留)
obs_delay_steps: [0, 0]
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (from SA3 畢業 det90.1%, 乾淨起點非 egwadwgi 擴散態) ---
checkpoint: 'logs/rnn_car/sa3_deploy_dense_lr2e4_ne1024_s42/checkpoint_30000.pt'
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa4, deploy_dense, distr, a2c, aux, asymmetric, rnn64, obs79d, lidar_only, dense_deploy, lr2e4, density_distr]
notes: "SA4 密度分布版:靜態 per-env [6,8](smooth 密度硬跳). resume SA3畢業. ⚠️靜態range機制待實作+等det裁決。"
