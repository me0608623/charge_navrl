# wd_sa5_v3f — SA5 v3f-react: 耐久導航 (stage 5) + 反應訓練 — 接 SA4_v3f 乾淨 baseline
#
# 起點 (2026-06-22):
#   ckpt = sa4_v3f_ne1024_s42/checkpoint_420000.pt
#   (SA4_v3f 完訓：deterministic SR 88.5% / CR 11.5%，無 sin 波。
#    診斷定案 CR 死因 = 動態障礙晚反應碰撞，詳見記憶 project_sa4_v3f_completion_diagnosis)
#
# v3f-react 改善兩軸（只作用在 SA5）：
#   軸一 Reward：clearance-gated 減速懲罰 penalty_speed_near_obs=0.8
#     → 障礙進反應區 [0.45,1.2]m 時罰「快速」(p^2·v_forward)，補 sparse「接觸前無梯度」根因。
#   軸二 場景：動態速度壓回可反應範圍 (patrol 0.25-0.50 等) + corridor_crossing 0.25→0.15
#     + obs_near_goal_radius 2.0→2.5（障礙別生在反應區內）。
#   → curriculum_version = warp_drive_single_agent_v3f_react（其餘 stage 同 v3e）。
#
# ⚠️ obs 79D 不變，可 resume SA4_v3f ckpt。train/play 必須 CHARGE_USE_ACT_HIST=0。
#
# 用法 (用 launcher 設好 env var):
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa5_v3f --headless \
#     --checkpoint logs/rnn_car/sa4_v3f_ne1024_s42/checkpoint_420000.pt \
#     --run_name sa5_v3f_react_ne1024_s42

name: wd_sa5_v3f
description: "SA5 v3f-react: 耐久導航 (stage 5) + 反應訓練 (clearance-gated 減速 + 壓低動態速度). From SA4_v3f checkpoint_420000 (SR 88.5%, 無 sin 波). obs 79D, curriculum v3f_react. Requires CHARGE_USE_ACT_HIST=0."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3f_react   # v3e patch + SA5 clearance-gated 減速 + 壓低動態速度
initial_stage: 5
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 420000
seed: 42

# --- RL optimizer (SA5 stage: lr 由 curriculum trainer sync 覆寫) ---
lr: 0.0005
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.995
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 1.0
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy ---
ent_coeff: 0.0
ent_coeff_linear: 0.005
ent_coeff_angular: 0.02

# --- v3f: 無 act_hist → dropout 無意義 ---
act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (RNN64, 維持 SA1_v3f) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.85
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (全噪聲 ON，50% 校準) ---
lidar_no_noise: false
lidar_displacement_std_per_meter: 0.00020
lidar_displacement_std_soft: 0.001
lidar_displacement_std: 0.0
lidar_hole_rate: 0.10
lidar_distractor_rate: 0.001
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
lidar_obs_noise_std: 0.003
lidar_block_dropout_prob: 0.03
lidar_block_dropout_width: [3, 8]
lidar_displacement_std_per_meter_dr: [0.00015, 0.00030]
lidar_displacement_std_soft_dr: [0.001, 0.010]
lidar_displacement_std_dr: null
lidar_hole_rate_dr: [0.05, 0.15]

# --- Sim-to-Real DR (延遲 DR 保留：馬達延遲是治實車極限環藥方) ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

# Observation latency DR (修好版：關閉，原 [0,1] 是 sin 波兇手)
obs_delay_steps: [0, 0]  # 2026-06-20 obs_delay 誤植→關閉(原[0,1]害 policy 滿舵);馬達延遲 actuator_dr 保留
# Heading stability (off)
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: logs/rnn_car/sa4_v3f_ne1024_s42/checkpoint_420000.pt
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa5, v3f, react, a2c, aux, asymmetric, rnn64, velocity_aux, rmin025, no_act_hist, obs79d, smoothness0, obsdelay0, clearance_gated, endurance]
notes: "SA5 v3f-react: stage 5 耐久導航 + 反應訓練 (clearance-gated 減速 penalty_speed_near_obs=0.8 + 動態速度壓回可反應範圍). From SA4_v3f checkpoint_420000 (SR 88.5%, 無 sin 波). obs 79D, curriculum v3f_react. 對症動態障礙晚反應碰撞."
