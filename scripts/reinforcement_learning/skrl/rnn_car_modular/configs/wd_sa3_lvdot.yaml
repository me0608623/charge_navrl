# wd_sa3_lvdot — SA3 LV-DOT: resume SA2 ckpt → stage 3 + ★距離稅 (react clearance-gated)
#
# ★ (2026-07-08) 目的 = LV-DOT channel「有沒有被 policy 用」的真正驗收實驗。
#   資料流裁決已證: channel 接好但無稅 baseline 下 policy 速度決策**不用** channel
#   (SA1/SA2 ablation 速度頭 KL ≪ 0.01, 只弱用轉向)。stage3 加**距離稅**後:
#     - 若 policy 學會用障礙速度提早減速 → ablation 速度頭 KL 竄過 0.01 = 稅生效。
#     - 若仍 ≈0 → 升級成 TTC / 速度-gated 稅 (threat × (1+β·v_closing))。
#   距離稅 = react clearance-gated 減速懲罰 (penalty_speed_near_obs=0.8), 就是畢業政策
#   sa5_v3f_react 破線用的那顆 reward (proven, 全綠畢業表)。先用它、不一步到位 TTC
#   (依用戶「先距離稅、看 ablation 再決定」拍板)。
#
# ★距離稅已寫進 YAML 欄位 penalty_speed_near_obs: 0.8 (下方)——消除 CLI-only footgun,
#   不會忘。CLI --penalty_speed_near_obs 仍可覆寫此值(想掃參數時用)。
#
# ⚠ resume SA2 109D ckpt (obs 佈局相同)。train/play 必須 CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1。
# ⚠ checkpoint 欄位是 SA2 「名目最終」(270000);啟動前**改成 SA2 實際最終/最佳 checkpoint**。
#
# 啟動指令 (稅已在 YAML, 不必再帶 CLI):
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa3_lvdot --headless --run_name sa3_lvdot_ne1024_s42
#
# 驗收 (加稅前後對比):
#   加稅前 baseline: SA2 ckpt_30000 速度頭 KL 0.00082 (弱用僅轉向)
#   加稅後: python scripts/reinforcement_learning/skrl/tools/lvdot_ablation.py \
#             --checkpoint logs/rnn_car/sa3_lvdot_ne1024_s42/checkpoint_XXXXX.pt
#           → 速度頭 KL > 0.01 = 稅生效 (policy 用 channel 速度提早減速);仍 ≈0 = 升級 TTC。
#   行為層: 新增動態專屬曲線 charge/dyn_fast_{speed,omega}_{d}m vs dyn_slow_*
#           → fast(快接近) 組是否在遠距就降速/抬|ω| ≫ slow 組。

name: wd_sa3_lvdot
description: "SA3 LV-DOT: resume SA2 → stage 3 + 距離稅 (react penalty_speed_near_obs, CLI 0.8). LV-DOT channel 使用性驗收實驗. Requires CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1 + --penalty_speed_near_obs 0.8."

# --- Environment / curriculum (與 SA2 同, 只 stage 進 3, 隔離「稅」變因) ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v3e
initial_stage: 3
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0005
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy (★SA3-5 退火 0.005/0.02, 依血淚 CHECKLIST; policy 已適應, 降熵讓其收斂 exploit) ---
ent_coeff: 0.0
ent_coeff_linear: 0.005
ent_coeff_angular: 0.02

act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls (與 SA2 同) ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.3          # 尺寸隨機化 ON (物理半徑 0.3±0.15; 碰撞=phys+0.5)
obs_collision_base: 0.9     # (LV-DOT mode 忽略; 碰撞=物理半徑+0.5)
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA3: 仍 clean 隔離「稅」變因; noise/channel DR 留 SA4+) ---
lidar_no_noise: true
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
no_domain_randomization: false

# --- Sim-to-Real DR (與 SA2 同) ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

obs_delay_steps: [0, 0]
heading_stability_weight: 0.0

# --- LV-DOT obstacle channel DR (SA3: 仍 clean; env._lvdot_dr wiring 留 SA4) ---

# --- ★距離稅 (react clearance-gated 減速稅; 寫進 YAML 消除 CLI footgun) ---
penalty_speed_near_obs: 0.8   # 畢業政策 sa5_v3f_react 破線的 proven 值; 覆寫 curriculum

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume (07-08: resume SA2 ckpt_60000; det eval SR 74.8%<90,
#   失敗集中撞牆19.4%(障礙避障5.6%良好),判斷=SA2 高探索熵 argmax 未磨利;
#   用戶決策切 SA3 賭低熵 0.005/0.02 磨利 deterministic + 同跑加稅實驗) ---
checkpoint: logs/rnn_car/sa2_lvdot_ne1024_s42/checkpoint_60000.pt
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa3, lvdot, a2c, aux, asymmetric, rnn64, obstacle_channel, resume_sa2, distance_tax, react]
notes: "SA3 LV-DOT: resume SA2 → stage 3 + 距離稅 (react penalty_speed_near_obs 0.8, 寫進 YAML). 目的=LV-DOT channel 使用性驗收(加稅前後 ablation 速度頭 KL 對比). 其餘與 SA2 同以隔離稅變因. ent 0.005/0.02 (SA3-5 退火,已驗過往 SA3 v3f/v3h/vaux 全同值)."
