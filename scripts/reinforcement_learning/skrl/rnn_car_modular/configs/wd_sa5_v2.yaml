# wd_sa5_v2 — SA5 v2: Endurance + full TLNI + per-ring bias + per-episode DR + obs latency
#
# SA5 是噪聲/DR 全面開啟的分水嶺。v2 維持 extractor_rnn（不切 wd_exact_rnn），
# 因為 v2 RNN64 本身已有足夠容量。
#
# 用法：
#   PYTHONUNBUFFERED=1 ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_sa5_v2 --headless \
#     --checkpoint logs/rnn_car/<sa4_v2_run>/checkpoint_XXXXXX.pt \
#     --run_name sa5_v2_ne1024_s42

name: wd_sa5_v2
description: "SA5 v2: Endurance, full TLNI + per-ring + per-episode DR + obs latency, asymmetric critic, RNN64, vel aux 13D."

# --- Environment / curriculum ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: warp_drive_single_agent_v1
initial_stage: 5
fixed_stage: true
scene_profile: warp_drive_single_agent_v1
obstacle_mode: rule_based

# --- Profiles (v2) ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget ---
num_envs: 1024
rollout_length: 300
timesteps: 270000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: partial
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy ---
ent_coeff: 0.0
ent_coeff_linear: 0.0
ent_coeff_angular: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder (v2: RNN64, 維持 extractor_rnn) ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- Step 3: velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 10
obs_size_rand: 0.0
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 7.0
room_size: null

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (SA5: full TLNI + per-ring bias + per-episode DR) ---
lidar_no_noise: false
lidar_displacement_std: 0.002
lidar_hole_rate: 0.20
lidar_distractor_rate: 0.002
lidar_distance_bias: true
lidar_per_ring_bias: true
lidar_obs_noise_std: 0.005
lidar_block_dropout_prob: 0.10
lidar_block_dropout_width: [3, 8]
lidar_displacement_std_dr: [0.0005, 0.005]
lidar_hole_rate_dr: [0.15, 0.30]

# --- Sim-to-Real DR ---
no_domain_randomization: false
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: false

# Observation latency DR (SA5: 50% chance 1-step delay)
obs_delay_steps: [0, 1]
# Heading stability (SA5: light penalty)
heading_stability_weight: -0.05

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

# --- Checkpoint / resume ---
checkpoint: null
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, sa5, v2, a2c, aux, asymmetric, rnn64, velocity_aux, full_tlni]
notes: "SA5 v2: endurance, full TLNI + per-ring + per-episode DR + obs latency [0,1], heading stability -0.05, asymmetric critic, RNN64, vel aux 13D. From SA4_v2."
