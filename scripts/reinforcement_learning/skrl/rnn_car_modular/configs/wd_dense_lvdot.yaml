# wd_dense_lvdot — 密集動態避障第一版: 12×12 密度課程 + TTC稅 + LV-DOT (resume SA3 暖啟)
#
# ★ (2026-07-09) 用戶目標: 12×12/20障礙維持成功率。煙測已過(12×12+20障礙+TTC稅跑得動+數學正確);
#   SA3在20障礙SR僅1.7%需重訓。用戶拍板: goal_first_v2走課程(稀疏→dense20障礙)+resume SA3暖啟+K=5第一版。
# 機制: TTC門檻稅(CLI --ttc_tax_weight)從 channel obs[79:109] 算碰撞剩餘時間<門檻扣分,closing speed
#   只有channel有→逼policy用速度預判(密集reactive LiDAR不夠)。保留距離稅penalty_speed_near_obs 0.8。
# 用法:
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_dense_lvdot --headless --run_name dense1_lvdot_ttc_ne1024_s42 \
#     --room_size 6 --ttc_tax_weight 0.4 --ttc_thresh 2.0 --ttc_warmup_start 50 --ttc_warmup_end 250
# 驗收(收工): lvdot_ablation 速度頭KL應>0.01(vs先前約0) + channel-歸零 det-eval SR應下降 = channel這次必要。

name: wd_dense_lvdot
description: "密集第一版: 12×12密度課程(goal_first_v2)+TTC稅+LV-DOT,resume SA3暖啟,K=5. Requires CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1 + CLI --room_size 6 --ttc_tax_weight 0.4."

task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: goal_first_v2
initial_stage: 3
fixed_stage: false
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

num_envs: 1024
rollout_length: 300
timesteps: 600000
seed: 42

lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0005
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

ent_coeff: 0.0
ent_coeff_linear: 0.02
ent_coeff_angular: 0.04

act_hist_dropout: 0.0

wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

predict_dim: 13
aux_velocity_topk: 3

obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 12
obs_size_rand: 0.3
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 5.0
room_size: 6.0

penalty_speed_near_obs: 0.8

aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

lidar_no_noise: true
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
no_domain_randomization: false

physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

obs_delay_steps: [0, 0]
heading_stability_weight: 0.0

reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 10
save_interval: 100

checkpoint: logs/rnn_car/sa3_lvdot_ne1024_s42/checkpoint_180000.pt
no_resume_optimizer: true

tags: [wd, dense, lvdot, ttc, goal_first_v2, 20obstacles, 12x12, resume_sa3]
notes: "密集第一版: 12x12 密度課程(goal_first_v2 stage3-12,到20障礙)+TTC稅(CLI 0.4)+距離稅0.8+LV-DOT K=5, resume SA3 ckpt_180000暖啟. 熵0.02/0.04探索."
