# wd_smoke_lvdot_dense — 階段1+2 煙測: 12×12 + 20障礙 + TTC稅 (LV-DOT 密集重訓前驗證)
#
# ★ (2026-07-09) 用戶選(c)先煙測:驗「20障礙場景 + TTC門檻稅」端到端跑得動,再決定正式課程。
#   goal_first_v2 stage 12 "ultimate" = 10靜+10動 = 20障礙(10動態);room_size 6 = 12×12m。
#   煙測目標(非訓練):①20障礙真的spawn(log障礙=10S+10D)②obs=109D channel填滿密集障礙
#   ③TTC稅算得出(reward_breakdown['ttc_tax'] 非NaN,逼近時 gate>0)④訓練loop不crash。
#
# 用法(★TTC稅+room_size 走 CLI):
#   PYTHONUNBUFFERED=1 CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1 \
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train/train_rnn_car_wdclip.py \
#     --experiment_config wd_smoke_lvdot_dense --headless --run_name smoke_lvdot_dense \
#     --room_size 6 --ttc_tax_weight 0.5 --ttc_thresh 2.0
#
# ⚠煙測用:resume SA3 ckpt_180000(有動作,看得出TTC gate);goal_first_v2 與 lvdot scene 相容性
#   正是煙測要驗的(若crash=curriculum家族不相容,改option b擴v3e)。timesteps 小(6k=20iter)。

name: wd_smoke_lvdot_dense
description: "SMOKE: 12×12+20障礙+TTC稅 端到端煙測(goal_first_v2 stage12). Requires CHARGE_USE_ACT_HIST=0 CHARGE_USE_LVDOT_OBS=1 + CLI --room_size 6 --ttc_tax_weight 0.5."

# --- Environment / curriculum (★goal_first_v2 stage12=20障礙) ---
task: Isaac-Navigation-Charge-VLP16-Curriculum-WD
curriculum_version: goal_first_v2
initial_stage: 12
fixed_stage: true
scene_profile: warp_drive_single_agent_v3
obstacle_mode: rule_based

# --- Profiles ---
reward_profile: wd_sparse
algorithm: a2c
aux_profile: wd_7d_geometry
encoder_profile: extractor_rnn
critic_profile: asymmetric

# --- Training budget (★煙測小 budget) ---
num_envs: 256
rollout_length: 300
timesteps: 6000
seed: 42

# --- RL optimizer ---
lr: 0.0002
rnn_lr: 0.0005
aux_lr: 0.0
aux_lr_predict_head: 0.0005
aux_lr_fc_middle: 0.0005
aux_lr_fc_front: 0.0005
aux_lr_extractor: 0.0005
vf_coeff: 0.5
gamma: 0.984
gae_lambda: 0.95
normalize_return: true
adv_norm_mode: mean_only
value_init_bias: 0.0
max_grad_norm: 0.5
tbptt_len: 0
lr_decay: 0.0

# --- PPO specific ---
ppo_epochs: 1
mini_batches: 1
clip_eps: 0.2

# --- Entropy ---
ent_coeff: 0.0
ent_coeff_linear: 0.005
ent_coeff_angular: 0.02

act_hist_dropout: 0.0

# --- WD-style gradient caps ---
wd_update_clip: true
wd_update_monitor_only: false
wd_actor_update_clip: 8.0
wd_critic_update_clip: 30.0
wd_module_entropy_eps: 0.000000000001
policy_loss_clamp: 20.0
vf_term_clamp: 8.0

# --- Model / encoder ---
charge_encoder_mode: extractor_rnn
hidden_dim: 64
preprocess_dim: 12
fc_dim: 64
wd_middle_dim: 48
rnn_type: RNN

# --- velocity aux 13D ---
predict_dim: 13
aux_velocity_topk: 3

# --- Obstacle / scene controls (★20障礙 + 12×12) ---
obs_lr: 0.0003
obs_ent_coeff: 0.1
obs_speed_limit: 0.8
train_goal_rate: 3
obs_reward_mode: zero
max_active_obstacles: 20        # ★放行到 20 (預設10不夠)
obs_size_rand: 0.3
obs_collision_base: 0.9
scene_bound_rand: 0.0
scene_bound_base: 5.0           # 配 room_size 6 (12×12) 縮小
room_size: 6.0                  # ★12×12m (2×room_size)

# --- Aux / RNN training ---
aux_seq_len: 15
aux_burn_in: 0
aux_seq_batch_size: 256
aux_grad_clip: 0.5
zero_preprocess_feature_for_rl: false

# --- LiDAR (煙測 clean) ---
lidar_no_noise: true
lidar_distance_bias: true
lidar_distance_bias_k_dr: [-0.005, 0.005]
lidar_distance_bias_b_dr: [-0.012, 0.012]
lidar_per_ring_bias: true
no_domain_randomization: false

# --- Sim-to-Real DR ---
physics_mass_dr: [0.85, 1.15]
physics_friction_dr: [0.7, 1.3]
physics_com_offset: 0.05
disturbance_wind_force: [0.0, 3.0]
disturbance_push_force: [5.0, 20.0]
disturbance_push_ratio: 0.10
enable_actuator_dr: true
actuator_delay_range: [0, 1]
actuator_velocity_scale: [0.97, 1.03]
actuator_motor_lag: 0.5

obs_delay_steps: [0, 0]
heading_stability_weight: 0.0

# --- Runtime / logging ---
reward_speed_v05: false
reward_mode: current
action_table_sample_size: 0
log_interval: 5
save_interval: 1000

# --- Checkpoint / resume (煙測 resume SA3 有動作看得出 TTC gate) ---
checkpoint: logs/rnn_car/sa3_lvdot_ne1024_s42/checkpoint_180000.pt
no_resume_optimizer: true

# --- Metadata ---
tags: [wd, smoke, lvdot, dense, ttc, 20obstacles, 12x12]
notes: "SMOKE 煙測: 12×12(room_size6)+20障礙(goal_first_v2 stage12)+TTC稅(CLI). 驗端到端跑得動+channel填+TTC算. 非訓練. resume SA3 ckpt_180000."
