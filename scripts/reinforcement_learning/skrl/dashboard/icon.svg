<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Robot body -->
  <circle cx="128" cy="120" r="40" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <!-- Robot heading arrow -->
  <polygon points="128,72 118,90 138,90" fill="#7aa2f7"/>
  <!-- LiDAR rays -->
  <g stroke="#ff9e64" stroke-width="2" opacity="0.6">
    <line x1="128" y1="120" x2="60" y2="80"/>
    <line x1="128" y1="120" x2="50" y2="120"/>
    <line x1="128" y1="120" x2="60" y2="160"/>
    <line x1="128" y1="120" x2="196" y2="80"/>
    <line x1="128" y1="120" x2="206" y2="120"/>
    <line x1="128" y1="120" x2="196" y2="160"/>
  </g>
  <!-- Goal marker -->
  <polygon points="200,50 206,65 220,65 208,75 213,90 200,80 187,90 192,75 180,65 194,65" fill="#9ece6a"/>
  <!-- Neural network nodes -->
  <g fill="#bb9af7" opacity="0.8">
    <circle cx="60" cy="200" r="8"/>
    <circle cx="100" cy="200" r="8"/>
    <circle cx="140" cy="200" r="8"/>
    <circle cx="180" cy="200" r="8"/>
  </g>
  <!-- NN connections -->
  <g stroke="#bb9af7" stroke-width="1.5" opacity="0.4">
    <line x1="60" y1="200" x2="100" y2="200"/>
    <line x1="100" y1="200" x2="140" y2="200"/>
    <line x1="140" y1="200" x2="180" y2="200"/>
    <line x1="80" y1="192" x2="120" y2="208"/>
    <line x1="120" y1="192" x2="160" y2="208"/>
  </g>
  <!-- Text -->
  <text x="128" y="235" text-anchor="middle" fill="#7aa2f7" font-family="sans-serif" font-size="18" font-weight="700">SKRL</text>
</svg>
